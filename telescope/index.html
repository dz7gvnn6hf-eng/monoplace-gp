<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Petit Télescope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap">
<style>
/* Layout: le ciel remplit l'écran, vu à travers un oculaire rond; les panneaux en laiton flottent en haut et en bas */
:root{
  color-scheme:dark;
  --night:#070a17; --ink:#e9ecff; --dim:#8d93b8; --brass:#e0aa45; --brass-dk:#8a5d17; --card:#121831; --sky:#8fd1ff;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body)}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#sky:active{cursor:grabbing}
.hud{position:fixed;left:0;right:0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
#top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));align-items:flex-end}
.chip{background:rgba(18,24,49,.85);border:1px solid rgba(224,170,69,.35);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:500;font-size:15px;white-space:nowrap}
.coins{color:var(--brass);font-weight:700;font-variant-numeric:tabular-nums}
button{font:700 16px var(--display);color:#1d1204;background:linear-gradient(#f3c768,var(--brass));border:0;border-bottom:3px solid var(--brass-dk);border-radius:14px;padding:10px 16px;cursor:pointer}
button:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button.ghost{background:rgba(18,24,49,.9);color:var(--ink);border:1px solid rgba(224,170,69,.4)}
#up small{display:block;font:400 12px var(--body)}
.right{display:flex;gap:8px;align-items:flex-end}
#mini{width:150px;height:100px;border:1px solid rgba(224,170,69,.45);border-radius:10px;background:rgba(7,10,23,.85);cursor:pointer}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(90vw,420px);text-align:center;
  background:rgba(18,24,49,.95);border:1px solid var(--brass);border-radius:14px;padding:10px 16px;font-size:15px;transition:opacity .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(3,5,12,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:2px solid var(--brass);border-radius:20px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto;text-align:center}
.box h2{font:700 24px var(--display);margin:6px 0;color:var(--brass);text-wrap:balance}
.box p{margin:8px 0;line-height:1.45}
.box .gain{font:700 18px var(--display);color:var(--sky)}
.photo{width:180px;height:180px;border-radius:50%;background:#02030a;border:4px solid var(--brass-dk)}
#book .box{max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}
.cell{background:rgba(255,255,255,.04);border-radius:12px;padding:8px;font-size:13px;min-width:0}
.cell canvas{width:80px;height:80px;border-radius:50%;background:#02030a}
.cell .q{width:80px;height:80px;border-radius:50%;background:#02030a;display:grid;place-items:center;margin:0 auto;font:700 30px var(--display);color:var(--dim)}
.cell b{display:block}
.cell span{color:var(--dim);font-size:12px}
@media (max-width:480px){#mini{width:110px;height:74px}.chip{font-size:13px;padding:5px 10px}button{font-size:14px;padding:9px 12px}}
</style>

<canvas id="sky"></canvas>
<div class="hud" id="top">
  <span class="chip coins" id="coins">✦ 0</span>
  <span class="chip" id="tname">Longue-vue en carton</span>
  <span class="chip" id="count">0 / 0</span>
</div>
<div class="hud" id="bottom">
  <canvas id="mini" width="300" height="200" aria-label="Carte du ciel : touche pour y aller"></canvas>
  <div class="right">
    <button class="ghost" id="bookBtn">📒 Carnet</button>
    <button id="up">Améliorer<small></small></button>
  </div>
</div>
<div id="toast" role="status"></div>
<div class="modal" id="card" hidden><div class="box">
  <canvas class="photo" id="photo" width="360" height="360"></canvas>
  <h2 id="cName"></h2><p id="cFact"></p><p class="gain" id="cGain"></p>
  <button id="cClose">Super !</button>
</div></div>
<div class="modal" id="book" hidden><div class="box">
  <h2>Mon carnet d'astronome</h2>
  <div class="grid" id="grid"></div>
  <button id="bClose">Fermer</button>
</div></div>

<script>
'use strict';
const W = 4400, H = 3000;
const $ = id => document.getElementById(id);
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- dessin des objets (coordonnées centrées, rayon r) ----------
function emo(g, ch, s, x = 0, y = 0) { g.font = `${s}px ${EMO}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, x, y); }
function ball(g, r, c1, c2) { const gr = g.createRadialGradient(-r*.35, -r*.35, r*.1, 0, 0, r); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); }
function shade(g, r) { const gr = g.createLinearGradient(-r, -r, r, r); gr.addColorStop(.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); }
function inBall(g, r, fn) { g.save(); g.beginPath(); g.arc(0, 0, r, 0, 7); g.clip(); fn(); g.restore(); }
function dots(g, r, col, list) { g.fillStyle = col; for (const [x, y, s] of list) { g.beginPath(); g.arc(x*r, y*r, s*r, 0, 7); g.fill(); } }
function ell(g, r, col, x, y, rx, ry, a = 0) { g.fillStyle = col; g.beginPath(); g.ellipse(x*r, y*r, rx*r, ry*r, a, 0, 7); g.fill(); }
const CRATERS = [[-.3,-.2,.18],[.35,.25,.14],[.1,-.5,.1],[-.2,.45,.12],[.5,-.15,.08],[-.55,.1,.07]];

const P = {
  lune(g, r) { ball(g, r, '#f2f2ee', '#8b8b86'); dots(g, r, 'rgba(60,60,70,.22)', CRATERS); shade(g, r); },
  mercure(g, r) { ball(g, r, '#cdbba8', '#655446'); dots(g, r, 'rgba(40,25,15,.25)', CRATERS); shade(g, r); },
  venus(g, r) { ball(g, r, '#fff6cf', '#c79a3c'); inBall(g, r, () => { for (let i = 0; i < 4; i++) ell(g, r, 'rgba(255,255,255,.22)', -.2 + i*.15, -.5 + i*.32, .9, .12, .25); }); shade(g, r); },
  mars(g, r) { ball(g, r, '#ff9b5c', '#9c3510'); dots(g, r, 'rgba(90,25,5,.35)', [[-.2,.1,.25],[.3,-.25,.18],[.15,.45,.15]]); ell(g, r, '#fff', 0, -.86, .38, .13); shade(g, r); },
  jupiter(g, r) {
    ball(g, r, '#f3e0c0', '#a8794e');
    inBall(g, r, () => { [['#c58a5a',-.55,.12],['#e8c9a2',-.3,.1],['#b5733f',-.05,.14],['#ead6b8',.22,.1],['#c08453',.45,.12],['#a86d43',.72,.1]].forEach(([c, y, h]) => { g.fillStyle = c; g.fillRect(-r, y*r, 2*r, h*r); }); ell(g, r, '#c9452a', .32, .34, .2, .11); });
    shade(g, r);
  },
  saturne(g, r) {
    const ring = () => { g.lineWidth = r*.22; g.strokeStyle = 'rgba(226,203,150,.85)'; g.beginPath(); g.ellipse(0, 0, r*1.6, r*.42, 0, 0, 7); g.stroke(); g.lineWidth = r*.08; g.strokeStyle = 'rgba(180,150,100,.8)'; g.beginPath(); g.ellipse(0, 0, r*1.32, r*.33, 0, 0, 7); g.stroke(); };
    g.save(); g.rotate(-.35); ring();
    ball(g, r, '#f6e6b8', '#b38c4c'); inBall(g, r, () => { g.fillStyle = 'rgba(160,120,60,.3)'; g.fillRect(-r, -.2*r, 2*r, .15*r); g.fillRect(-r, .25*r, 2*r, .12*r); }); shade(g, r);
    g.beginPath(); g.rect(-2*r, 0, 4*r, 2*r); g.clip(); ring(); g.restore();
  },
  uranus(g, r) { g.save(); g.rotate(1.45); g.lineWidth = r*.05; g.strokeStyle = 'rgba(200,240,255,.5)'; g.beginPath(); g.ellipse(0, 0, r*1.5, r*.25, 0, 0, 7); g.stroke(); g.restore(); ball(g, r, '#d4fbf8', '#3ba5b8'); shade(g, r); },
  neptune(g, r) { ball(g, r, '#77adff', '#1a2c85'); ell(g, r, 'rgba(10,20,70,.6)', -.25, .2, .22, .13); ell(g, r, 'rgba(255,255,255,.55)', .1, -.35, .35, .05); shade(g, r); },
  pluton(g, r) {
    ball(g, r, '#ead4b9', '#76543f');
    g.fillStyle = '#fff3e2'; g.beginPath(); const x = .15*r, y = .05*r, s = .42*r;
    g.moveTo(x, y + s*.9); g.bezierCurveTo(x - s*1.2, y, x - s*.6, y - s*.9, x, y - s*.3); g.bezierCurveTo(x + s*.6, y - s*.9, x + s*1.2, y, x, y + s*.9); g.fill();
    shade(g, r);
  },
};
const fun = (ch, extra) => (g, r, t, o) => {
  g.save();
  if (o.anim === 'spin') g.rotate(t*.4 + o.d);
  else g.translate(0, Math.sin(t*1.5 + o.d)*r*.08), g.rotate(Math.sin(t*.8 + o.d)*.15);
  emo(g, ch, r*1.7); if (extra) extra(g, r, t);
  g.restore();
};

// d = difficulté (il faut un télescope de puissance ≈ d pour le découvrir, 2×d pour une photo parfaite)
const OBJ = [
  { id:'lune', name:'La Lune', d:1, r:60, draw:P.lune, fact:"À 384 000 km de nous. Les traces de pas des astronautes de 1969 y sont encore, car il n'y a pas de vent pour les effacer !" },
  { id:'ballon', name:"Un ballon d'anniversaire", d:1.1, r:34, anim:'bob', draw:fun('🎈'), fact:"Il s'est échappé d'une fête et il est monté trèèès haut. Quelqu'un le cherche sûrement !" },
  { id:'chaussette', name:'Une chaussette perdue', d:1.5, r:34, anim:'spin', draw:fun('🧦'), fact:"Voilà donc où partent les chaussettes qui disparaissent de la machine à laver !" },
  { id:'venus', name:'Vénus', d:2, r:46, draw:P.venus, fact:"La planète la plus chaude : plus de 460 °C. Une pizza y cuirait en quelques secondes." },
  { id:'pizza', name:'Une pizza volante', d:2.5, r:36, anim:'spin', draw:fun('🍕'), fact:"Livraison spatiale ! Dommage, il manque déjà une part." },
  { id:'mars', name:'Mars', d:3, r:40, draw:P.mars, fact:"La planète rouge. Sa couleur vient de la rouille dans son sol. Des robots s'y promènent en ce moment !" },
  { id:'mercure', name:'Mercure', d:3.5, r:30, draw:P.mercure, fact:"La planète la plus proche du Soleil. Une année n'y dure que 88 jours : tu aurais 4 anniversaires par an !" },
  { id:'vache', name:"Une vache de l'espace", d:4, r:42, anim:'bob', draw:fun('🐄'), fact:"Meuuuh ! Elle a sauté par-dessus la Lune et elle n'a jamais réussi à redescendre." },
  { id:'jupiter', name:'Jupiter', d:5, r:92, draw:P.jupiter, fact:"La plus grosse planète. Sa tache rouge est une tempête plus grande que la Terre entière !" },
  { id:'selfie', name:'Un astronaute qui fait un selfie', d:6, r:42, anim:'bob', draw:fun('🧑‍🚀', (g, r) => emo(g, '🤳', r*.8, r*.75, -r*.2)), fact:"« Moi devant l'univers, trop beau ! » Il va avoir plein de j'aime." },
  { id:'saturne', name:'Saturne', d:8, r:62, draw:P.saturne, fact:"Ses anneaux sont faits de glace et de roche. Elle est si légère qu'elle flotterait dans une baignoire géante !" },
  { id:'canard', name:'Un canard en plastique géant', d:10, r:44, anim:'bob', draw:fun('🦆'), fact:"Coin coin ! Quelqu'un a pris un très, très, très gros bain." },
  { id:'ovni', name:'Une soucoupe volante', d:12, r:44, anim:'bob', draw:fun('🛸', (g, r) => { g.font = `700 ${r*.28}px sans-serif`; g.fillStyle = '#ff5b5b'; g.textAlign = 'center'; g.fillText('ÉLÈVE CONDUCTEUR', 0, r*.95); }), fact:"Elle a un autocollant « Élève conducteur ». Attention, elle zigzague !" },
  { id:'uranus', name:'Uranus', d:14, r:56, draw:P.uranus, fact:"Elle tourne couchée sur le côté, comme une boule de bowling qui roule." },
  { id:'chat', name:'Un chat astronaute', d:16, r:42, anim:'bob', draw:fun('🐱', (g, r) => { g.lineWidth = r*.08; g.strokeStyle = 'rgba(200,230,255,.8)'; g.fillStyle = 'rgba(160,210,255,.15)'; g.beginPath(); g.arc(0, 0, r*1.05, 0, 7); g.fill(); g.stroke(); }), fact:"Il est venu chercher la souris... de l'ordinateur des astronautes." },
  { id:'neptune', name:'Neptune', d:20, r:54, draw:P.neptune, fact:"Les vents les plus rapides du système solaire : plus de 2 000 km/h. Accroche ta casquette !" },
  { id:'guitare', name:'Une guitare qui joue toute seule', d:25, r:44, anim:'spin', draw:fun('🎸'), fact:"Dans l'espace, il n'y a pas d'air pour porter le son. Personne ne l'entend jouer faux !" },
  { id:'pluton', name:'Pluton', d:30, r:28, draw:P.pluton, fact:"Une planète naine, toute petite et toute froide... avec un grand cœur dessiné sur elle !" },
  { id:'toilettes', name:'Des toilettes spatiales', d:35, r:42, anim:'spin', draw:fun('🚽'), fact:"Vrai ! Dans la station spatiale, les toilettes aspirent comme un aspirateur au lieu de couler." },
  { id:'dino', name:'Un dinosaure en vacances', d:40, r:46, anim:'bob', draw:fun('🦖', (g, r) => emo(g, '🕶️', r*.55, r*.3, -r*.5)), fact:"Voilà où ils sont tous partis ! Il a même pris ses lunettes de soleil." },
  { id:'beigne', name:'Un beigne géant', d:55, r:50, anim:'spin', draw:fun('🍩'), fact:"Grand comme une planète. Glaçage rose et pépites, évidemment." },
  { id:'coucou', name:'Un extraterrestre qui fait coucou', d:70, r:46, anim:'bob', draw:fun('👽', (g, r, t) => { emo(g, '👋', r*.8, r*.85, -r*.3 + Math.sin(t*6)*r*.08); }), fact:"Il te fait coucou ! Fais-lui coucou aussi, c'est poli." },
  { id:'fin', name:'Un extraterrestre... avec SON télescope !', d:100, r:50, anim:'bob', draw:fun('👽', (g, r) => emo(g, '🔭', r*1.1, -r*.9, r*.1)), fact:"Il te regarde avec son propre télescope. Il vient de te découvrir, lui aussi ! Tu es dans SON carnet maintenant." },
];

const TELES = [
  { n:'Longue-vue en carton', p:1.2, cost:0 },
  { n:'Petite lunette', p:2.5, cost:10 },
  { n:'Télescope de jardin', p:4.5, cost:35 },
  { n:'Télescope de pro', p:8, cost:80 },
  { n:'Grand télescope de montagne', p:14, cost:180 },
  { n:'Observatoire géant', p:25, cost:380 },
  { n:'Télescope spatial', p:45, cost:750 },
  { n:'Super télescope spatial', p:90, cost:1400 },
  { n:'Télescope intergalactique', p:200, cost:2600 },
];

// placement en spirale autour du départ : plus c'est loin, plus c'est loin dans le ciel
OBJ.forEach((o, i) => { const a = i*2.4, rad = 260 + i*78; o.x = Math.max(160, Math.min(W - 160, W/2 + Math.cos(a)*rad*1.3)); o.y = Math.max(160, Math.min(H - 160, H/2 + Math.sin(a)*rad*.8)); });

// ---------- état ----------
let S = { coins:0, lvl:0, found:{} }; // found[id] = 1 (vu) ou 2 (photo parfaite)
try { Object.assign(S, JSON.parse(localStorage.getItem('telescope-save')) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem('telescope-save', JSON.stringify(S)); } catch (e) {} };
const power = () => TELES[S.lvl].p;
// netteté de 0 (invisible/flou) à 1 (parfait)
const clarity = o => Math.max(0, Math.min(1, (power()/o.d - .6)/1.4));
const DISCOVER = .25, PERFECT = .95;
const reward = o => Math.max(5, Math.round(10*o.d)), bonus = o => Math.max(3, Math.round(5*o.d));

const cv = $('sky'), ctx = cv.getContext('2d');
let w, h, dpr, cam = { x: OBJ[0].x - 120, y: OBJ[0].y + 60 };
function resize() { dpr = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight; cv.width = w*dpr; cv.height = h*dpr; }
addEventListener('resize', resize); resize();
const viewR = () => Math.min(w, h*.82)*(.4 + .008*S.lvl);

const STARS = Array.from({ length: 1400 }, () => ({ x: Math.random()*W, y: Math.random()*H, m: Math.random(), s: Math.random()*1.3 + .3, p: Math.random()*6 }));
const off = document.createElement('canvas'), og = off.getContext('2d');

// flou = dessiné en très petite résolution puis agrandi (marche sur tous les navigateurs)
function drawObj(g, o, x, y, dispR, c, t) {
  const res = (.035 + .965*c*c)*dpr, B = 1.8, size = Math.max(3, Math.ceil(2*B*o.r*res));
  off.width = off.height = size;
  og.setTransform(res, 0, 0, res, size/2, size/2);
  o.draw(og, o.r, t, o);
  g.save(); g.imageSmoothingEnabled = true; g.globalAlpha = .3 + .7*c;
  g.drawImage(off, x - B*dispR, y - B*dispR, 2*B*dispR, 2*B*dispR);
  g.restore();
}
const scaleK = c => .2 + .8*c;

let shoot = null, nextShoot = 4;
function frame(now) {
  const t = now/1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#030409'; ctx.fillRect(0, 0, w, h);
  const R = viewR(), cx = w/2, cy = h/2 - h*.03, ox = cx - cam.x, oy = cy - cam.y;
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R); bg.addColorStop(0, '#0d1433'); bg.addColorStop(1, '#060818'); ctx.fillStyle = bg; ctx.fillRect(cx - R, cy - R, 2*R, 2*R);
  // un meilleur télescope montre plus d'étoiles faibles
  const lim = .25 + S.lvl*.085;
  for (const s of STARS) {
    if (s.m > lim) continue;
    const x = s.x + ox, y = s.y + oy;
    if (Math.abs(x - cx) > R || Math.abs(y - cy) > R) continue;
    ctx.globalAlpha = .45 + .4*Math.sin(t*2 + s.p)*(reduced ? 0 : 1) + .15;
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  for (const o of OBJ) {
    const c = clarity(o); if (power()/o.d < .6) continue;
    const k = scaleK(c), x = o.x + ox, y = o.y + oy, dr = o.r*k;
    if (Math.hypot(x - cx, y - cy) > R + dr*2) continue;
    const j = reduced ? 0 : (1 - c)*4; // l'air qui tremble quand c'est flou
    drawObj(ctx, o, x + Math.sin(t*7 + o.d)*j, y + Math.cos(t*5 + o.d)*j, dr, c, t);
    if (S.found[o.id]) { ctx.font = '600 13px ' + getComputedStyle(document.body).fontFamily; ctx.fillStyle = 'rgba(233,236,255,.75)'; ctx.textAlign = 'center'; ctx.fillText((S.found[o.id] === 2 ? '⭐ ' : '') + o.name, x, y + dr*1.8 + 14); }
  }
  // étoile filante
  if (!shoot && t > nextShoot) { const a = Math.random()*6.28; shoot = { x: cam.x + Math.cos(a)*R*.6, y: cam.y + Math.sin(a)*R*.6, vx: -Math.cos(a)*R*.9, vy: -Math.sin(a)*R*.9 + 40, t0: t }; }
  if (shoot) {
    const k = t - shoot.t0, x = shoot.x + shoot.vx*k + ox, y = shoot.y + shoot.vy*k + oy;
    shoot.sx = x; shoot.sy = y;
    const gr = ctx.createLinearGradient(x, y, x - shoot.vx*.25, y - shoot.vy*.25); gr.addColorStop(0, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = gr; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - shoot.vx*.25, y - shoot.vy*.25); ctx.stroke();
    if (k > 1.6) { shoot = null; nextShoot = t + 5 + Math.random()*7; }
  }
  ctx.restore();
  // oculaire en laiton + réticule
  ctx.lineWidth = 14; ctx.strokeStyle = '#3b2a10'; ctx.beginPath(); ctx.arc(cx, cy, R + 7, 0, 7); ctx.stroke();
  ctx.lineWidth = 4; ctx.strokeStyle = '#e0aa45'; ctx.beginPath(); ctx.arc(cx, cy, R + 2, 0, 7); ctx.stroke();
  const vg = ctx.createRadialGradient(cx, cy, R*.75, cx, cy, R); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(143,209,255,.18)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - 14, cy); ctx.lineTo(cx + 14, cy); ctx.moveTo(cx, cy - 14); ctx.lineTo(cx, cy + 14); ctx.stroke();
  drawMini(R);
  requestAnimationFrame(frame);
}

// ---------- carte du ciel ----------
const mini = $('mini'), mg = mini.getContext('2d');
function drawMini(R) {
  const sx = mini.width/W, sy = mini.height/H;
  mg.clearRect(0, 0, mini.width, mini.height);
  for (const o of OBJ) {
    if (power()/o.d < .6) continue;
    mg.fillStyle = S.found[o.id] ? '#e0aa45' : 'rgba(233,236,255,.6)';
    mg.beginPath(); mg.arc(o.x*sx, o.y*sy, S.found[o.id] ? 4 : 3, 0, 7); mg.fill();
  }
  mg.strokeStyle = '#8fd1ff'; mg.lineWidth = 2; mg.beginPath(); mg.ellipse(cam.x*sx, cam.y*sy, R*sx, R*sy, 0, 0, 7); mg.stroke();
}
mini.addEventListener('click', e => { const b = mini.getBoundingClientRect(); cam.x = (e.clientX - b.left)/b.width*W; cam.y = (e.clientY - b.top)/b.height*H; });

// ---------- contrôles ----------
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.x = Math.max(0, Math.min(W, cam.x - (e.clientX - drag.x))); cam.y = Math.max(0, Math.min(H, cam.y - (e.clientY - drag.y)));
  drag.x = e.clientX; drag.y = e.clientY;
});
cv.addEventListener('pointerup', e => { if (drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) tap(e.clientX, e.clientY); drag = null; });
addEventListener('keydown', e => {
  const m = { ArrowLeft:[-40,0], ArrowRight:[40,0], ArrowUp:[0,-40], ArrowDown:[0,40] }[e.key];
  if (m && $('card').hidden && $('book').hidden) { cam.x = Math.max(0, Math.min(W, cam.x + m[0])); cam.y = Math.max(0, Math.min(H, cam.y + m[1])); e.preventDefault(); }
});

function tap(px, py) {
  const R = viewR(), cx = w/2, cy = h/2 - h*.03;
  if (Math.hypot(px - cx, py - cy) > R) return;
  if (shoot && Math.hypot(px - shoot.sx, py - shoot.sy) < 45) {
    const g = 2 + S.lvl*3; S.coins += g; shoot = null; save(); hud(); toast(`Étoile filante attrapée ! +${g} ✦`); return;
  }
  let best = null, bd = 1e9;
  for (const o of OBJ) {
    const c = clarity(o); if (power()/o.d < .6) continue;
    const d = Math.hypot(px - (o.x + cx - cam.x), py - (o.y + cy - cam.y));
    if (d < o.r*scaleK(c)*1.3 + 18 && d < bd) { best = o; bd = d; }
  }
  if (best) look(best);
}

function look(o) {
  const c = clarity(o);
  if (c < DISCOVER) { toast("C'est trop flou... on dirait juste une tache. Améliore ton télescope !"); return; }
  let gain = '';
  if (!S.found[o.id]) { S.found[o.id] = 1; S.coins += reward(o); gain = `Nouvelle découverte ! +${reward(o)} ✦`; }
  if (c >= PERFECT && S.found[o.id] === 1) { S.found[o.id] = 2; S.coins += bonus(o); gain += (gain ? ' · ' : '') + `Photo parfaite ⭐ +${bonus(o)} ✦`; }
  if (S.found[o.id] === 1 && c < PERFECT) gain += (gain ? ' — ' : '') + 'Photo floue : reviens avec un meilleur télescope pour la photo parfaite ⭐';
  save(); hud();
  const all = OBJ.every(x => S.found[x.id]);
  $('cName').textContent = o.name; $('cFact').textContent = o.fact;
  $('cGain').textContent = gain + (all && o.id === 'fin' ? ' 🎉 Bravo, tu as tout découvert dans le ciel !' : '');
  const pg = $('photo').getContext('2d'); pg.setTransform(1, 0, 0, 1, 0, 0); pg.clearRect(0, 0, 360, 360);
  drawObjCard(pg, o, 360, c);
  $('card').hidden = false; $('cClose').focus();
}
function drawObjCard(g, o, size, c) {
  const d0 = dpr; dpr = 1; // la carte a sa propre résolution
  drawObj(g, o, size/2, size/2, size*.26, c, performance.now()/1000);
  dpr = d0;
}
$('cClose').onclick = () => { $('card').hidden = true; };

// ---------- interface ----------
let tt;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3200); }
function hud() {
  $('coins').textContent = '✦ ' + S.coins;
  $('tname').textContent = '🔭 ' + TELES[S.lvl].n;
  $('count').textContent = Object.keys(S.found).length + ' / ' + OBJ.length + ' découvertes';
  const nx = TELES[S.lvl + 1], up = $('up');
  if (!nx) { up.disabled = true; up.firstChild.textContent = 'Télescope au max !'; up.lastChild.textContent = ''; return; }
  up.disabled = S.coins < nx.cost;
  up.firstChild.textContent = 'Améliorer';
  up.lastChild.textContent = `${nx.n} · ${nx.cost} ✦`;
}
$('up').onclick = () => {
  const nx = TELES[S.lvl + 1]; if (!nx || S.coins < nx.cost) return;
  S.coins -= nx.cost; S.lvl++; save(); hud();
  toast(`Nouveau : ${nx.n} ! Tu vois plus loin et plus net.`);
};
$('bookBtn').onclick = () => {
  const grid = $('grid'); grid.textContent = '';
  for (const o of OBJ) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const f = S.found[o.id], c = clarity(o);
    if (f) {
      const pc = document.createElement('canvas'); pc.width = pc.height = 160; drawObjCard(pc.getContext('2d'), o, 160, c); cell.append(pc);
      cell.insertAdjacentHTML('beforeend', `<b></b><span>${f === 2 ? '⭐ Photo parfaite' : 'Photo floue'}</span>`); cell.querySelector('b').textContent = o.name;
    } else {
      cell.innerHTML = `<div class="q">?</div><b>???</b><span>${c >= DISCOVER ? 'Visible ! Cherche-le dans le ciel' : power()/o.d >= .6 ? 'Trop flou pour le moment' : 'Il faut un télescope plus puissant'}</span>`;
    }
    grid.append(cell);
  }
  $('book').hidden = false; $('bClose').focus({ preventScroll: true }); $('book').firstChild.scrollTop = 0;
};
$('bClose').onclick = () => { $('book').hidden = true; };
for (const m of ['card', 'book']) $(m).addEventListener('click', e => { if (e.target === $(m)) $(m).hidden = true; });

// auto-vérification de la progression : chaque télescope débloque au moins une découverte
console.assert(TELES.every((tl, i) => i === 0 || OBJ.some(o => { const r = tl.p/o.d; return r >= .95 && TELES[i - 1].p/o.d < .95; })), 'un niveau ne débloque rien');

hud();
toast(Object.keys(S.found).length ? 'Bon retour, astronome !' : 'Glisse pour bouger le télescope. Touche ce que tu vois !');
requestAnimationFrame(frame);
</script>
</html>
