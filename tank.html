<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tank – Terrain d'essai</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c9d1db;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
  canvas{display:block;cursor:crosshair}
  #hud{position:fixed;left:12px;top:12px;color:#223;font-size:14px;line-height:1.5;pointer-events:none;background:rgba(255,255,255,.75);padding:8px 12px;border-radius:8px}
  #hud b{font-size:18px}
  .stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(0,0,0,.08);border:2px solid rgba(0,0,0,.2);display:none;pointer-events:none}
  .stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.3)}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud">Cibles détruites : <b id="score">0</b><br><span id="help">ZQSD / WASD / flèches : rouler · Souris : viser · Clic ou Espace : tirer</span></div>
<div class="stick" id="stickL"><i></i></div>
<div class="stick" id="stickR"><i></i></div>
<script type="module">
import * as THREE from 'three';

const SIZE = 200, HALF = SIZE / 2 - 2;          // plateforme et limite de déplacement
const MAX_SPEED = 12, TURN_RATE = 2.2, TURRET_RATE = 3.5;
const SHELL_SPEED = 45, SHELL_LIFE = 1.4, RELOAD = 0.6;
const UP = new THREE.Vector3(0, 1, 0);
const rnd = (a = 1) => (Math.random() - 0.5) * 2 * a;

// ---------- scène ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d1db);
scene.fog = new THREE.Fog(0xc9d1db, 60, 140);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
const CAM_OFFSET = new THREE.Vector3(0, 24, 17);  // vue de haut 3/4

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa4b0, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 120 });
scene.add(sun, sun.target);

// sol en terre : texture dessinée une fois, qui se répète sans couture
const dirt = document.createElement('canvas');
dirt.width = dirt.height = 512;
const dc = dirt.getContext('2d');
dc.fillStyle = '#86674a'; dc.fillRect(0, 0, 512, 512);
const blot = (n, rMin, rMax, light, alpha) => {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = rMin + Math.random() * (rMax - rMin);
    dc.fillStyle = `hsla(${24 + Math.random() * 12},${28 + Math.random() * 14}%,${light + rnd(10)}%,${alpha})`;
    for (const ox of [-512, 0, 512]) for (const oy of [-512, 0, 512]) { dc.beginPath(); dc.arc(x + ox, y + oy, r, 0, 7); dc.fill(); }
  }
};
blot(1500, 6, 22, 38, 0.18);                     // grandes taches
blot(3000, 1.5, 5, 34, 0.35);                    // grain
blot(500, 1, 2.5, 55, 0.7);                      // cailloux clairs
blot(400, 1, 2.5, 20, 0.6);                      // cailloux sombres
const dirtTex = new THREE.CanvasTexture(dirt);
dirtTex.wrapS = dirtTex.wrapT = THREE.RepeatWrapping;
dirtTex.repeat.set(SIZE / 8, SIZE / 8);
dirtTex.colorSpace = THREE.SRGBColorSpace;
dirtTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const platform = new THREE.Mesh(new THREE.BoxGeometry(SIZE, 2, SIZE), new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 }));
platform.position.y = -1;
platform.receiveShadow = true;
scene.add(platform);

// traces de chenilles : un morceau de trace posé au sol chaque fois qu'une chenille a parcouru ~0,5 m
const markCanvas = document.createElement('canvas');
markCanvas.width = markCanvas.height = 32;
const mc = markCanvas.getContext('2d');
mc.fillStyle = 'rgba(45,30,18,.35)'; mc.fillRect(0, 0, 32, 32);
mc.fillStyle = 'rgba(35,22,12,.6)';
for (const y of [2, 18]) mc.fillRect(0, y, 32, 8);
const markTex = new THREE.CanvasTexture(markCanvas);
const MAX_MARKS = 4000;                          // shortcut: les plus vieilles traces disparaissent d'un coup, ajouter un fondu si ça se voit
const marks = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.85, 1).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ map: markTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1 }),
  MAX_MARKS);
marks.count = 0;
marks.frustumCulled = false;
scene.add(marks);
let markIdx = 0;
const markDummy = new THREE.Object3D();
function addMark(a, b) {
  markDummy.position.set((a.x + b.x) / 2, 0.015, (a.z + b.z) / 2);
  markDummy.rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
  markDummy.scale.set(1, 1, a.distanceTo(b) + 0.05);
  markDummy.updateMatrix();
  marks.setMatrixAt(markIdx, markDummy.matrix);
  markIdx = (markIdx + 1) % MAX_MARKS;
  marks.count = Math.max(marks.count, markIdx || MAX_MARKS);
  marks.instanceMatrix.needsUpdate = true;
}

const resize = () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
};
addEventListener('resize', resize);
resize();

// ---------- tank ----------
const mat = (color, extra) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...extra });
const mesh = (geo, m, x = 0, y = 0, z = 0, parent) => {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = o.receiveShadow = true;
  if (parent) parent.add(o);
  return o;
};
const box = (w, h, d, m, x, y, z, parent) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, parent);
const cyl = (rt, rb, h, m, x, y, z, parent, seg = 14) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y, z, parent);
const green = mat(0x55703d), darkGreen = mat(0x405a2f), dark = mat(0x2b2f2a), steel = mat(0x5b605a, { metalness: 0.4 }), tan = mat(0x6e5d3c);

// texture des chenilles (maillons), une par côté pour les faire défiler à des vitesses différentes
const treadCanvas = document.createElement('canvas');
treadCanvas.width = 64; treadCanvas.height = 8;
const tc = treadCanvas.getContext('2d');
tc.fillStyle = '#262826'; tc.fillRect(0, 0, 64, 8);
tc.fillStyle = '#4a4d48';
for (let i = 0; i < 4; i++) tc.fillRect(i * 16, 0, 7, 8);
const treadTex = () => {
  const t = new THREE.CanvasTexture(treadCanvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 1);
  return t;
};

const tank = new THREE.Group();                  // position + cap ; avant = +z local, gauche = +x local
const body = new THREE.Group();                  // tangage (recul, accélération)
tank.add(body);

// caisse
box(2.2, 0.6, 4.0, darkGreen, 0, 0.65, 0, body);
box(3.7, 0.35, 3.6, green, 0, 1.12, -0.15, body);
box(3.7, 0.35, 0.9, green, 0, 1.0, 1.85, body).rotation.x = 0.45;           // glacis avant
box(3.7, 0.5, 0.15, darkGreen, 0, 0.95, -1.98, body);
for (let i = 0; i < 5; i++) box(1.6, 0.05, 0.12, dark, 0, 1.31, -0.9 - i * 0.2, body);  // grille moteur
const exhausts = [-0.9, 0.9].map((x) => {
  cyl(0.1, 0.1, 0.4, dark, x, 1.0, -2.1, body).rotation.x = Math.PI / 2;
  return new THREE.Vector3(x, 1.0, -2.35);
});
const lightMat = mat(0xfff3c4, { emissive: 0xfff0b0, emissiveIntensity: 0.6 });
for (const x of [-1.35, 1.35]) box(0.25, 0.15, 0.12, lightMat, x, 1.25, 1.95, body);
for (const x of [-1.55, 1.55]) box(0.45, 0.22, 1.2, tan, x, 1.4, -0.7, body);  // coffres sur les garde-boue

// chenilles et roues
const treads = [], wheels = [];
for (const sx of [-1, 1]) {
  const tex = treadTex();
  box(0.85, 0.9, 4.3, mat(0xffffff, { map: tex, roughness: 0.95 }), sx * 1.5, 0.45, 0, body);
  treads.push({ sx, tex });
  for (let i = 0; i < 7; i++) {
    const end = i === 0 || i === 6, r = end ? 0.36 : 0.29;
    const pivot = new THREE.Group();
    pivot.position.set(sx * 1.94, end ? 0.5 : 0.36, -1.85 + i * (3.7 / 6));
    cyl(r, r, 0.16, end ? steel : dark, 0, 0, 0, pivot, 16).rotation.z = Math.PI / 2;
    box(0.06, 0.1, r * 1.6, steel, sx * 0.08, 0, 0, pivot);                 // rayons : on voit la roue tourner
    box(0.06, r * 1.6, 0.1, steel, sx * 0.08, 0, 0, pivot);
    body.add(pivot);
    wheels.push({ sx, pivot, r });
  }
}

// tourelle
const turret = new THREE.Group();
turret.position.y = 1.3;
body.add(turret);
box(2.0, 0.55, 2.2, green, 0, 0.28, -0.1, turret);
box(1.7, 0.14, 1.8, green, 0, 0.6, -0.15, turret);
box(1.8, 0.45, 0.6, darkGreen, 0, 0.3, -1.45, turret);                       // panier arrière
box(1.0, 0.5, 0.45, darkGreen, 0, 0.3, 1.1, turret);                         // masque du canon
cyl(0.32, 0.36, 0.3, darkGreen, 0.5, 0.8, -0.45, turret);                    // tourelleau
cyl(0.28, 0.28, 0.06, dark, 0.5, 0.98, -0.45, turret);
cyl(0.04, 0.04, 0.8, dark, 0.5, 1.05, -0.05, turret).rotation.x = Math.PI / 2;  // mitrailleuse
box(0.22, 0.14, 0.16, dark, -0.45, 0.72, 0.35, turret);                      // périscope
for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) {
  cyl(0.07, 0.07, 0.25, dark, sx * 1.02, 0.42 + i * 0.12, 0.65, turret, 8).rotation.x = Math.PI / 2;  // lance-fumigènes
}
const antenna = new THREE.Group();
antenna.position.set(-0.7, 0.66, -1.3);
cyl(0.012, 0.03, 2.2, dark, 0, 1.1, 0, antenna, 5);
turret.add(antenna);

// canon
const barrel = new THREE.Group();
barrel.position.set(0, 0.3, 1.2);
turret.add(barrel);
cyl(0.12, 0.15, 3.0, dark, 0, 0, 1.5, barrel).rotation.x = Math.PI / 2;
cyl(0.2, 0.2, 0.45, dark, 0, 0, 1.6, barrel).rotation.x = Math.PI / 2;      // évacuateur de fumée
box(0.36, 0.28, 0.4, steel, 0, 0, 3.05, barrel);                              // frein de bouche
const MUZZLE = new THREE.Vector3(0, 0, 3.3);

// flash de bouche : boule + jets avant et latéraux (frein de bouche)
const flash = new THREE.Group();
flash.position.copy(MUZZLE);
const flashMat = new THREE.MeshBasicMaterial({ color: 0xffe9a0, transparent: true, depthWrite: false });
const flashMat2 = new THREE.MeshBasicMaterial({ color: 0xff9a2e, transparent: true, depthWrite: false });
const coneGeo = new THREE.ConeGeometry(0.35, 1.6, 10).rotateX(Math.PI / 2).translate(0, 0, 0.8);
flash.add(new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 8), flashMat));
const fwd = new THREE.Mesh(coneGeo, flashMat2); fwd.scale.set(1.2, 1.2, 1.6); flash.add(fwd);
for (const sx of [-1, 1]) { const c = new THREE.Mesh(coneGeo, flashMat2); c.rotation.y = sx * Math.PI / 2; c.scale.set(0.7, 0.7, 0.7); flash.add(c); }
flash.visible = false;
barrel.add(flash);
const flashLight = new THREE.PointLight(0xffaa44, 0, 18);
flashLight.position.copy(MUZZLE);
barrel.add(flashLight);

tank.rotation.y = Math.PI;                       // regarde vers le haut de l'écran
scene.add(tank);

let speed = 0, turretYaw = Math.PI, reload = 0, recoil = 0, shake = 0, score = 0, flashT = 0;
let pitch = 0, pitchV = 0, sway = 0, swayV = 0, puffT = 0;

// ---------- cibles ----------
const targets = [];
function addTarget(x, z, kind) {
  const crate = kind === 'crate';
  const m = crate ? box(2, 2, 2, mat(0xc98a4b), 0, 1, 0) : cyl(0.8, 0.8, 1.8, mat(0xc0392b), 0, 0.9, 0);
  const g = new THREE.Group();
  g.add(m);
  g.position.set(x, 0, z);
  scene.add(g);
  const maxHp = crate ? 3 : 1;
  targets.push({ g, mesh: m, r: crate ? 1.3 : 0.9, maxHp, hp: maxHp, home: new THREE.Vector3(x, 0, z), vel: new THREE.Vector3(), hit: 0, dead: 0 });
}
for (let i = -3; i <= 3; i++) addTarget(i * 4, -20, i % 2 ? 'barrel' : 'crate');  // rangée de test devant
for (let i = 0; i < 40; i++) {
  const a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 75;
  addTarget(Math.cos(a) * d, Math.sin(a) * d, Math.random() < 0.5 ? 'crate' : 'barrel');
}

// ---------- particules ----------
const parts = [];
const sphereGeo = new THREE.SphereGeometry(1, 10, 8), cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const ringGeo = new THREE.RingGeometry(0.85, 1, 40).rotateX(-Math.PI / 2);
// color → color2 au fil de la vie ; grow = taille finale multipliée par (1 + grow)
function spawn({ geo = sphereGeo, color, color2, pos, vel = new THREE.Vector3(), life = 1, size = 1, grow = 0, grav = 0, drag = 0, opacity = 1, spin = false }) {
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
  m.position.copy(pos);
  m.scale.setScalar(size);
  if (spin) m.rotation.set(Math.random() * 6, Math.random() * 6, 0);
  scene.add(m);
  parts.push({ m, vel, life, t: 0, size, grow, grav, drag, opacity, spin, c1: new THREE.Color(color), c2: color2 === undefined ? null : new THREE.Color(color2) });
}
const jitter = (v, a) => v.clone().add(new THREE.Vector3(rnd(a), rnd(a), rnd(a)));

// traces de brûlure au sol
const scorchCanvas = document.createElement('canvas');
scorchCanvas.width = scorchCanvas.height = 64;
const sc = scorchCanvas.getContext('2d'), grad = sc.createRadialGradient(32, 32, 0, 32, 32, 32);
grad.addColorStop(0, 'rgba(25,22,20,.85)'); grad.addColorStop(0.6, 'rgba(40,36,32,.45)'); grad.addColorStop(1, 'rgba(40,36,32,0)');
sc.fillStyle = grad; sc.fillRect(0, 0, 64, 64);
const scorchTex = new THREE.CanvasTexture(scorchCanvas), scorchGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
const scorches = [];
function scorch(pos, size) {
  const m = new THREE.Mesh(scorchGeo, new THREE.MeshBasicMaterial({ map: scorchTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
  m.position.set(pos.x, 0.02, pos.z);
  m.rotation.y = Math.random() * 6;
  m.scale.setScalar(size);
  scene.add(m);
  scorches.push({ m, t: 12 });
  if (scorches.length > 30) { const s = scorches.shift(); scene.remove(s.m); s.m.material.dispose(); }
}

const impactLight = new THREE.PointLight(0xff8a3c, 0, 20);
scene.add(impactLight);

function explode(pos, big, debrisColor = 0x5a4029) {
  const s = big ? 2 : 1;
  const p = pos.clone().setY(Math.max(pos.y, 0.6));
  for (let i = 0; i < 5 * s; i++) spawn({ pos: jitter(p, 0.3 * s), vel: new THREE.Vector3(rnd(2), 1 + Math.random() * 2, rnd(2)), color: 0xfff1a8, color2: 0xff4d00, life: 0.3 + Math.random() * 0.15, size: 0.45 * s, grow: 2.5 });
  for (let i = 0; i < 9 * s; i++) spawn({ pos: jitter(p, 0.5 * s), vel: new THREE.Vector3(rnd(2.5 * s), 1.5 + Math.random() * 2.5, rnd(2.5 * s)), color: 0x3d3a36, color2: 0xb9b6b0, life: 1.4 + Math.random() * 1.2, size: 0.4 * s, grow: 3, drag: 1.5, opacity: 0.75 });
  for (let i = 0; i < 12 * s; i++) spawn({ geo: cubeGeo, pos: p, vel: new THREE.Vector3(rnd(8 * s), 4 + Math.random() * 8 * s, rnd(8 * s)), color: 0xffd34d, color2: 0xff5a1a, life: 0.35 + Math.random() * 0.2, size: 0.08, grav: 18 });
  for (let i = 0; i < 8 * s; i++) spawn({ geo: cubeGeo, pos: p, vel: new THREE.Vector3(rnd(6 * s), 3 + Math.random() * 7 * s, rnd(6 * s)), color: debrisColor, life: 1.2 + Math.random() * 0.6, size: 0.12 + Math.random() * 0.2 * s, grav: 25, spin: true });
  spawn({ geo: ringGeo, pos: new THREE.Vector3(p.x, 0.06, p.z), color: 0x8f8a82, life: 0.45, size: 0.6 * s, grow: 7, opacity: 0.6 });
  impactLight.position.copy(p).y += 1.5;
  impactLight.intensity = 60 * s;
  scorch(p, 2.4 * s);
}

// ---------- tir ----------
const shells = [];
const shellGeo = new THREE.SphereGeometry(1, 8, 6), shellMat = new THREE.MeshBasicMaterial({ color: 0xffd36b });
function fire() {
  if (reload > 0) return;
  reload = RELOAD; recoil = 1; shake = 0.45; flashT = 0.09;
  pitchV -= 1.4; swayV -= 6;                     // la caisse se cabre, l'antenne fouette
  barrel.updateWorldMatrix(true, false);
  const tip = barrel.localToWorld(MUZZLE.clone());
  const dir = new THREE.Vector3(Math.sin(turretYaw), 0, Math.cos(turretYaw));
  const side = new THREE.Vector3(dir.z, 0, -dir.x);

  const s = new THREE.Mesh(shellGeo, shellMat);
  s.scale.set(0.12, 0.12, 0.6);
  s.position.copy(tip);
  s.lookAt(tip.clone().add(dir));
  scene.add(s);
  shells.push({ m: s, vel: dir.clone().multiplyScalar(SHELL_SPEED), life: SHELL_LIFE });

  // boule de feu vers l'avant et jets latéraux du frein de bouche
  for (let i = 0; i < 7; i++) spawn({ pos: tip, vel: dir.clone().multiplyScalar(6 + Math.random() * 8).add(jitter(UP, 1).multiplyScalar(0.8)), color: 0xfff4b8, color2: 0xff6a00, life: 0.12 + Math.random() * 0.08, size: 0.35, grow: 2 });
  for (const sx of [-1, 1]) for (let i = 0; i < 4; i++) spawn({ pos: tip, vel: side.clone().multiplyScalar(sx * (5 + Math.random() * 4)).addScaledVector(dir, 2), color: 0xffe08a, color2: 0xff7a20, life: 0.1, size: 0.22, grow: 1.5 });
  // fumée qui reste en nuage
  for (let i = 0; i < 12; i++) spawn({ pos: tip, vel: dir.clone().multiplyScalar(1.5 + Math.random() * 6).addScaledVector(side, rnd(2)).add(new THREE.Vector3(0, Math.random() * 1.5, 0)), color: 0x9e9a94, color2: 0xd8d6d2, life: 1.3 + Math.random() * 0.8, size: 0.35, grow: 4, drag: 2.5, opacity: 0.7 });
  for (const sx of [-1, 1]) for (let i = 0; i < 4; i++) spawn({ pos: tip, vel: side.clone().multiplyScalar(sx * (3 + Math.random() * 3)), color: 0xa8a49e, color2: 0xdddbd7, life: 1 + Math.random() * 0.5, size: 0.3, grow: 3, drag: 3, opacity: 0.6 });
  // étincelles
  for (let i = 0; i < 10; i++) spawn({ geo: cubeGeo, pos: tip, vel: dir.clone().multiplyScalar(14 + Math.random() * 12).add(jitter(UP, 3)), color: 0xffe066, color2: 0xff7a20, life: 0.25 + Math.random() * 0.15, size: 0.07, grav: 10 });
  // le souffle soulève la poussière autour du tank
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    spawn({ pos: tank.position.clone().add(new THREE.Vector3(Math.cos(a) * 2.4, 0.3, Math.sin(a) * 2.4)), vel: new THREE.Vector3(Math.cos(a) * 5, 0.6, Math.sin(a) * 5), color: 0xae9270, life: 0.9, size: 0.4, grow: 2.5, drag: 3, opacity: 0.45 });
  }
}

// ---------- entrées ----------
const keys = {};
addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', (e) => { keys[e.code] = false; });
const mouse = new THREE.Vector2(), ray = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let useMouse = false, mouseDown = false;
addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') { useMouse = true; mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); } });
addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') mouseDown = true; });
addEventListener('pointerup', (e) => { if (e.pointerType === 'mouse') mouseDown = false; });

// tactile : joystick gauche = rouler, droit = viser (tire tant qu'il est poussé)
const sticks = { L: { id: null, x: 0, y: 0, ox: 0, oy: 0, el: stickL }, R: { id: null, x: 0, y: 0, ox: 0, oy: 0, el: stickR } };
const STICK_R = 50;
function onTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (e.type === 'touchstart') {
      const s = t.clientX < innerWidth / 2 ? sticks.L : sticks.R;
      if (s.id !== null) continue;
      Object.assign(s, { id: t.identifier, ox: t.clientX, oy: t.clientY, x: 0, y: 0 });
      Object.assign(s.el.style, { display: 'block', left: t.clientX + 'px', top: t.clientY + 'px' });
      document.getElementById('help').textContent = 'Gauche : rouler · Droite : viser et tirer';
    }
    for (const s of Object.values(sticks)) {
      if (s.id !== t.identifier) continue;
      if (e.type === 'touchmove') {
        let dx = t.clientX - s.ox, dy = t.clientY - s.oy;
        const l = Math.hypot(dx, dy);
        if (l > STICK_R) { dx *= STICK_R / l; dy *= STICK_R / l; }
        s.x = dx / STICK_R; s.y = dy / STICK_R;
        s.el.firstChild.style.transform = `translate(${dx}px,${dy}px)`;
      } else if (e.type !== 'touchstart') {
        Object.assign(s, { id: null, x: 0, y: 0 });
        s.el.style.display = 'none';
        s.el.firstChild.style.transform = '';
      }
    }
  }
}
for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) addEventListener(ev, onTouch, { passive: false });

const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const turnToward = (cur, want, max) => cur + Math.max(-max, Math.min(max, wrap(want - cur)));
const tmp = new THREE.Vector3();

// ---------- boucle ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.max(1e-4, Math.min(clock.getDelta(), 0.05));  // jamais 0 : on divise par dt plus bas
  const k = (...c) => c.some((x) => keys[x]) ? 1 : 0;

  // déplacement : clavier en commandes de tank, joystick = direction à l'écran
  let throttle = k('KeyW', 'KeyZ', 'ArrowUp') - k('KeyS', 'ArrowDown');
  let turn = k('KeyA', 'KeyQ', 'ArrowLeft') - k('KeyD', 'ArrowRight');
  const yaw0 = tank.rotation.y, speed0 = speed;
  const L = sticks.L, mag = Math.hypot(L.x, L.y);
  if (mag > 0.2) {
    const want = Math.atan2(L.x, L.y);           // écran droite = +x, écran bas = +z
    tank.rotation.y = turnToward(tank.rotation.y, want, TURN_RATE * dt);
    throttle = mag * Math.max(0, Math.cos(wrap(want - tank.rotation.y)));
    turn = 0;
  }
  tank.rotation.y += turn * TURN_RATE * dt;
  speed += (throttle * MAX_SPEED - speed) * Math.min(1, dt * 3);
  tank.position.x += Math.sin(tank.rotation.y) * speed * dt;
  tank.position.z += Math.cos(tank.rotation.y) * speed * dt;

  // collisions tank / cibles (cercles) et bords
  for (const t of targets) {
    if (t.dead) continue;
    tmp.subVectors(tank.position, t.g.position).setY(0);
    const d = tmp.length(), min = t.r + 2;
    if (d < min && d > 0.001) {
      tank.position.addScaledVector(tmp, (min - d) / d * 0.6);
      t.g.position.addScaledVector(tmp, -(min - d) / d * 0.4);  // on pousse la cible
    }
  }
  tank.position.x = Math.max(-HALF, Math.min(HALF, tank.position.x));
  tank.position.z = Math.max(-HALF, Math.min(HALF, tank.position.z));

  // chenilles et roues : chaque côté roule à sa vitesse quand le tank tourne
  const yawRate = wrap(tank.rotation.y - yaw0) / dt;
  for (const tr of treads) tr.tex.offset.x += tr.sx * (speed - tr.sx * yawRate * 1.5) * dt / 1.075;
  for (const w of wheels) w.pivot.rotation.x += (speed - w.sx * yawRate * 1.5) * dt / w.r;
  for (const tr of treads) {
    const p = tank.localToWorld(tmp.set(tr.sx * 1.5, 0, 0));
    if (!tr.last) tr.last = p.clone();
    else if (p.distanceTo(tr.last) > 0.5) { addMark(tr.last, p); tr.last.copy(p); }
  }

  // la caisse plonge/se cabre (ressort), l'antenne oscille
  const accel = (speed - speed0) / dt;
  pitchV += (-pitch * 70 - pitchV * 9 - accel * 0.12) * dt;
  pitch += pitchV * dt;
  body.rotation.x = pitch;
  swayV += (-sway * 40 - swayV * 3 - accel * 0.4) * dt;
  sway += swayV * dt;
  antenna.rotation.x = sway * 0.15;

  // fumée d'échappement et poussière quand il roule
  puffT -= dt;
  if (puffT <= 0 && Math.abs(speed) > 1) {
    puffT = 0.09;
    tank.updateWorldMatrix(true, true);
    for (const e of exhausts) spawn({ pos: body.localToWorld(e.clone()), vel: new THREE.Vector3(rnd(0.5), 1.2, rnd(0.5)), color: 0x6d6a66, color2: 0xcfcdc9, life: 0.9, size: 0.18, grow: 3, drag: 1, opacity: 0.5 });
    for (const sx of [-1.5, 1.5]) spawn({ pos: body.localToWorld(tmp.set(sx, 0.2, -Math.sign(speed) * 2.1)), vel: new THREE.Vector3(rnd(0.6), 0.5, rnd(0.6)), color: 0xa8895f, life: 0.8, size: 0.3, grow: 2.5, drag: 2, opacity: 0.35 });
  }

  // visée
  let aiming = false;
  if (useMouse) {
    ray.setFromCamera(mouse, camera);
    if (ray.ray.intersectPlane(ground, tmp)) { turretYaw = turnToward(turretYaw, Math.atan2(tmp.x - tank.position.x, tmp.z - tank.position.z), TURRET_RATE * dt); }
  }
  const R = sticks.R;
  if (Math.hypot(R.x, R.y) > 0.3) {
    turretYaw = turnToward(turretYaw, Math.atan2(R.x, R.y), TURRET_RATE * dt);
    aiming = true;
  }
  turret.rotation.y = turretYaw - tank.rotation.y;

  // tir : le canon recule d'un coup puis revient en douceur
  reload -= dt;
  if (keys.Space || mouseDown || aiming) fire();
  recoil = Math.max(0, recoil - dt * 2.2);
  barrel.position.z = 1.2 - 0.6 * recoil * recoil;
  flashT -= dt;
  flash.visible = flashT > 0;
  if (flash.visible) {
    const f = flashT / 0.09;
    flash.scale.setScalar(0.6 + (1 - f) * 0.9 + Math.random() * 0.2);
    flash.rotation.z = Math.random() * 6;
    flashMat.opacity = flashMat2.opacity = f;
  }
  flashLight.intensity = Math.max(0, flashT) * 900;
  impactLight.intensity *= Math.pow(0.0005, dt);

  // obus traçants
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.m.position.addScaledVector(s.vel, dt);
    s.life -= dt;
    spawn({ pos: s.m.position, color: 0xffc35a, color2: 0xe2e0dc, life: 0.3, size: 0.13, grow: 1.5, opacity: 0.8 });
    let hit = null;
    for (const t of targets) {
      if (!t.dead && Math.hypot(s.m.position.x - t.g.position.x, s.m.position.z - t.g.position.z) < t.r + 0.2) { hit = t; break; }
    }
    const out = Math.abs(s.m.position.x) > SIZE / 2 || Math.abs(s.m.position.z) > SIZE / 2;
    if (hit || s.life <= 0 || out) {
      explode(s.m.position, false);
      scene.remove(s.m);
      shells.splice(i, 1);
      if (hit) {
        hit.hp--; hit.hit = 0.15;
        hit.vel.addScaledVector(s.vel, 0.12);
        if (hit.hp <= 0) {
          hit.dead = 4; hit.g.visible = false;
          explode(hit.g.position.clone().setY(1), true, hit.mesh.material.color.getHex());
          shake = 0.8;
          document.getElementById('score').textContent = ++score;
        }
      }
    }
  }

  // cibles : glissade, clignotement, réapparition
  for (const t of targets) {
    if (t.dead) {
      t.dead -= dt;
      if (t.dead <= 0) { t.dead = 0; t.hp = t.maxHp; t.g.position.copy(t.home); t.vel.set(0, 0, 0); t.g.visible = true; }
      continue;
    }
    t.g.position.addScaledVector(t.vel, dt);
    t.vel.multiplyScalar(Math.pow(0.02, dt));
    t.hit = Math.max(0, t.hit - dt);
    t.mesh.material.emissive.setHex(t.hit > 0 ? 0xffffff : 0x000000);
    t.mesh.material.emissiveIntensity = 0.8;
  }

  // particules
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    const f = Math.min(1, p.t / p.life);
    p.vel.y -= p.grav * dt;
    if (p.drag) p.vel.multiplyScalar(Math.exp(-p.drag * dt));
    p.m.position.addScaledVector(p.vel, dt);
    if (p.grav && p.m.position.y < 0.05) { p.m.position.y = 0.05; p.vel.multiplyScalar(0.5); p.vel.y *= -0.3; }
    if (p.spin) { p.m.rotation.x += dt * 8; p.m.rotation.y += dt * 6; }
    p.m.scale.setScalar(p.size * (1 + p.grow * Math.sqrt(f)));
    if (p.c2) p.m.material.color.copy(p.c1).lerp(p.c2, Math.min(1, f * 1.6));
    p.m.material.opacity = p.opacity * (1 - f);
    if (p.t >= p.life) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
  }
  for (let i = scorches.length - 1; i >= 0; i--) {
    const s = scorches[i];
    s.t -= dt;
    s.m.material.opacity = Math.min(1, s.t / 3);
    if (s.t <= 0) { scene.remove(s.m); s.m.material.dispose(); scorches.splice(i, 1); }
  }

  // caméra et ombre qui suivent le tank
  shake = Math.max(0, shake - dt * 2);
  camera.position.copy(tank.position).add(CAM_OFFSET);
  camera.position.x += rnd(shake * 0.5);
  camera.position.z += rnd(shake * 0.5);
  camera.lookAt(tank.position);
  sun.position.copy(tank.position).add(tmp.set(20, 40, 15));
  sun.target.position.copy(tank.position);

  renderer.render(scene, camera);
});
window.game = { tank, targets, shells, parts, marks, get score() { return score; } };  // pour les tests
</script>
</body>
