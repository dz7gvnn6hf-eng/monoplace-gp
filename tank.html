<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tank – Terrain d'essai</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bcd3e6;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
  canvas{display:block;cursor:crosshair}
  #hud{position:fixed;left:12px;top:12px;color:#223;font-size:14px;line-height:1.5;pointer-events:none;background:rgba(255,255,255,.75);padding:8px 12px;border-radius:8px}
  #hud b{font-size:18px}
  #swap{pointer-events:auto;font:inherit;font-size:13px;margin:4px 0 2px 6px;padding:5px 10px;border:1px solid #556;border-radius:6px;background:#fff;color:#223;cursor:pointer}
  #swap:focus-visible{outline:2px solid #2a6;outline-offset:2px}
  .stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(0,0,0,.08);border:2px solid rgba(0,0,0,.2);display:none;pointer-events:none}
  .stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.3)}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud">Cibles détruites : <b id="score">0</b><br><span id="tankName"></span> <button id="swap" type="button">Prendre le navire (T)</button><br><span id="help">W A S D ou flèches : avancer et tourner · Souris : viser · Clic ou Espace : tirer</span></div>
<div class="stick" id="stickL"><i></i></div>
<div class="stick" id="stickR"><i></i></div>
<script type="module">
import * as THREE from 'three';

const SIZE = 200, HALF = SIZE / 2 - 2;          // zone jouable
const WORLD = 280;                               // le terrain dépasse un peu, le brouillard cache le bord
const SHELL_SPEED = 45, SHELL_LIFE = 1.4;
const UP = new THREE.Vector3(0, 1, 0);
const rnd = (a = 1) => (Math.random() - 0.5) * 2 * a;
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const WATER = -1.5, LAKE_X = 0, LAKE_Z = 62;    // niveau de l'eau et centre du lac (au sud du départ)

// ---------- relief ----------
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
function noise(x, z) {                           // bruit de valeur 2D, 0..1
  const xi = Math.floor(x), zi = Math.floor(z), u = smoothstep(0, 1, x - xi), v = smoothstep(0, 1, z - zi);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function groundY(x, z) {
  const n = noise(x / 38, z / 38) + noise(x / 17 + 50, z / 17) * 0.45 + noise(x / 7, z / 7 + 20) * 0.1;
  const hills = (n - 0.78) * 13 * smoothstep(12, 35, Math.hypot(x, z));  // plat autour du départ
  const shore = 34 + (noise(x / 14 + 7, z / 14 + 3) - 0.5) * 16;           // rive irrégulière
  return hills - 9 * smoothstep(shore + 8, shore - 6, Math.hypot(x - LAKE_X, z - LAKE_Z));
}
const groundNormal = (x, z, out) => out.set(groundY(x - 0.5, z) - groundY(x + 0.5, z), 1, groundY(x, z - 0.5) - groundY(x, z + 0.5)).normalize();
const dirtAt = (x, z, slope) => Math.min(1, smoothstep(0.6, 0.75, noise(x / 12 + 100, z / 12)) + slope * 1.5);  // 0 = herbe, 1 = terre
const qYaw = new THREE.Quaternion(), nrm = new THREE.Vector3();
function alignToGround(o, x, z, yaw, lift) {     // pose un objet plat sur la pente
  o.position.set(x, groundY(x, z) + lift, z);
  o.quaternion.setFromUnitVectors(UP, groundNormal(x, z, nrm)).multiply(qYaw.setFromAxisAngle(UP, yaw));
}

// ---------- scène ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd3e6);
scene.fog = new THREE.Fog(0xbcd3e6, 70, 150);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
const CAM_OFFSET = new THREE.Vector3(0, 24, 17);  // vue de haut 3/4

scene.add(new THREE.HemisphereLight(0xe2efff, 0x55663a, 1.4));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 120 });
scene.add(sun, sun.target);

// texture de détail en gris (grain, cailloux), teintée par les couleurs du terrain
const detail = document.createElement('canvas');
detail.width = detail.height = 256;
const dc = detail.getContext('2d');
dc.fillStyle = '#cfcfcf'; dc.fillRect(0, 0, 256, 256);
const speckle = (n, rMin, rMax, light, alpha) => {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, r = rMin + Math.random() * (rMax - rMin);
    dc.fillStyle = `hsla(0,0%,${light + rnd(8)}%,${alpha})`;
    for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) { dc.beginPath(); dc.arc(x + ox, y + oy, r, 0, 7); dc.fill(); }
  }
};
speckle(500, 4, 12, 72, 0.2);
speckle(2500, 0.8, 2.5, 62, 0.35);
speckle(300, 0.8, 1.8, 100, 0.6);
const detailTex = new THREE.CanvasTexture(detail);
detailTex.wrapS = detailTex.wrapT = THREE.RepeatWrapping;
detailTex.repeat.set(WORLD / 5, WORLD / 5);
detailTex.colorSpace = THREE.SRGBColorSpace;
detailTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

// terrain : herbe, plaques de terre et pentes raides en terre
const SEG = 200;
const terrainGeo = new THREE.PlaneGeometry(WORLD, WORLD, SEG, SEG).rotateX(-Math.PI / 2);
const tp = terrainGeo.attributes.position;
for (let i = 0; i < tp.count; i++) tp.setY(i, groundY(tp.getX(i), tp.getZ(i)));
terrainGeo.computeVertexNormals();
const colors = new Float32Array(tp.count * 3), col = new THREE.Color();
const grassA = new THREE.Color(0x4c7a2e), grassB = new THREE.Color(0x7aa443), dirtC = new THREE.Color(0x8a6a48), sandC = new THREE.Color(0xc2a874);
for (let i = 0; i < tp.count; i++) {
  const x = tp.getX(i), z = tp.getZ(i), slope = 1 - terrainGeo.attributes.normal.getY(i);
  col.copy(grassA).lerp(grassB, noise(x / 6, z / 6)).lerp(dirtC, dirtAt(x, z, slope)).lerp(sandC, smoothstep(WATER + 0.9, WATER - 0.2, tp.getY(i)));  // plage
  col.multiplyScalar(0.92 + tp.getY(i) * 0.015);  // creux un peu plus sombres
  col.toArray(colors, i * 3);
}
terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ map: detailTex, vertexColors: true, roughness: 1 }));
terrain.receiveShadow = true;
scene.add(terrain);

// eau : un plan à niveau fixe, les terres plus hautes le cachent ; rides qui défilent
const waterCanvas = document.createElement('canvas');
waterCanvas.width = waterCanvas.height = 256;
const wc = waterCanvas.getContext('2d');
wc.fillStyle = '#c4dbe6'; wc.fillRect(0, 0, 256, 256);
wc.strokeStyle = 'rgba(255,255,255,.55)'; wc.lineWidth = 1.5;
for (let i = 0; i < 220; i++) {
  const x = Math.random() * 256, y = Math.random() * 256, w = 6 + Math.random() * 16;
  for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) { wc.beginPath(); wc.ellipse(x + ox, y + oy, w, w * 0.25, 0, Math.PI * 1.1, Math.PI * 1.9); wc.stroke(); }
}
const waterTex = new THREE.CanvasTexture(waterCanvas);
waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
waterTex.repeat.set(WORLD / 12, WORLD / 12);
waterTex.colorSpace = THREE.SRGBColorSpace;
const water = new THREE.Mesh(new THREE.PlaneGeometry(WORLD, WORLD).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x3d87ab, map: waterTex, roughness: 0.25, metalness: 0.1, transparent: true, opacity: 0.86 }));
water.position.y = WATER;
water.receiveShadow = true;
scene.add(water);
const surfaceY = (x, z) => Math.max(groundY(x, z), WATER);

// touffes d'herbe (une seule géométrie instanciée), écrasées par le tank
const tuftGeo = (() => {
  const pos = [], cols = [];
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * Math.PI, w = 0.07, h = 0.4 + Math.random() * 0.35, ox = rnd(0.15), oz = rnd(0.15);
    const A = [ox - Math.cos(a) * w, 0, oz - Math.sin(a) * w], B = [ox + Math.cos(a) * w, 0, oz + Math.sin(a) * w], C = [ox + rnd(0.15), h, oz + rnd(0.15)];
    pos.push(...A, ...B, ...C, ...B, ...A, ...C);  // deux faces, normales vers le haut : jamais de brin noir vu de dos
    cols.push(0.55, 0.55, 0.55, 0.55, 0.55, 0.55, 1, 1, 1, 0.55, 0.55, 0.55, 0.55, 0.55, 0.55, 1, 1, 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));  // éclairées comme le sol
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return g;
})();
const TUFTS = 9000;
const tuftMesh = new THREE.InstancedMesh(tuftGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), TUFTS);
const tufts = [], tuftCells = new Map(), tuftDummy = new THREE.Object3D();
const cellKey = (x, z) => Math.floor(x / 4) + ',' + Math.floor(z / 4);
function placeTuft(i) {
  const t = tufts[i];
  tuftDummy.position.set(t.x, groundY(t.x, t.z), t.z);
  tuftDummy.rotation.set(0, t.yaw, 0);
  tuftDummy.scale.set(t.s * (t.flat ? 1.4 : 1), t.s * (t.flat ? 0.15 : 1), t.s * (t.flat ? 1.4 : 1));
  tuftDummy.updateMatrix();
  tuftMesh.setMatrixAt(i, tuftDummy.matrix);
}
while (tufts.length < TUFTS) {
  const x = rnd(HALF), z = rnd(HALF);
  if (dirtAt(x, z, 1 - groundNormal(x, z, nrm).y) > 0.35 || groundY(x, z) < WATER + 0.5) continue;
  const i = tufts.length;
  tufts.push({ x, z, yaw: Math.random() * 6, s: 0.8 + Math.random() * 0.8, flat: false });
  placeTuft(i);
  tuftMesh.setColorAt(i, col.copy(grassA).lerp(grassB, 0.3 + Math.random() * 0.7));
  const k = cellKey(x, z);
  if (!tuftCells.has(k)) tuftCells.set(k, []);
  tuftCells.get(k).push(i);
}
tuftMesh.frustumCulled = false;
scene.add(tuftMesh);
let flattened = 0;
function flattenTufts(x, z) {
  let changed = false;
  for (let dx = -4; dx <= 4; dx += 4) for (let dz = -4; dz <= 4; dz += 4) {
    for (const i of tuftCells.get(cellKey(x + dx, z + dz)) || []) {
      const t = tufts[i];
      if (t.flat || Math.hypot(t.x - x, t.z - z) > 2.3) continue;
      t.flat = true; flattened++; changed = true;
      placeTuft(i);
      tuftMesh.setColorAt(i, col.setHex(0x5d6b33));
    }
  }
  if (changed) { tuftMesh.instanceMatrix.needsUpdate = true; tuftMesh.instanceColor.needsUpdate = true; }
}

const resize = () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
};
addEventListener('resize', resize);
resize();

// traces de chenilles : un morceau de trace posé au sol chaque fois qu'une chenille a parcouru ~0,5 m
const markCanvas = document.createElement('canvas');
markCanvas.width = markCanvas.height = 32;
const mc = markCanvas.getContext('2d');
mc.fillStyle = 'rgba(45,30,18,.35)'; mc.fillRect(0, 0, 32, 32);
mc.fillStyle = 'rgba(35,22,12,.6)';
for (const y of [2, 18]) mc.fillRect(0, y, 32, 8);
const markTex = new THREE.CanvasTexture(markCanvas);
const MAX_MARKS = 4000;                          // shortcut: les plus vieilles traces disparaissent d'un coup, ajouter un fondu si ça se voit
const marks = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.85, 1).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ map: markTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }),
  MAX_MARKS);
marks.count = 0;
marks.frustumCulled = false;
scene.add(marks);
let markIdx = 0;
const markDummy = new THREE.Object3D();
function addMark(a, b) {
  alignToGround(markDummy, (a.x + b.x) / 2, (a.z + b.z) / 2, Math.atan2(b.x - a.x, b.z - a.z), 0.06);
  markDummy.scale.set(1, 1, Math.hypot(b.x - a.x, b.z - a.z) + 0.05);
  markDummy.updateMatrix();
  marks.setMatrixAt(markIdx, markDummy.matrix);
  markIdx = (markIdx + 1) % MAX_MARKS;
  marks.count = Math.max(marks.count, markIdx || MAX_MARKS);
  marks.instanceMatrix.needsUpdate = true;
}

// ---------- tank ----------
const mat = (color, extra) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...extra });
const mesh = (geo, m, x = 0, y = 0, z = 0, parent) => {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = o.receiveShadow = true;
  if (parent) parent.add(o);
  return o;
};
const box = (w, h, d, m, x, y, z, parent) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z, parent);
const cyl = (rt, rb, h, m, x, y, z, parent, seg = 14) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y, z, parent);
const dark = mat(0x2b2f2a);

// texture des chenilles (maillons), une par côté pour les faire défiler à des vitesses différentes
const treadCanvas = document.createElement('canvas');
treadCanvas.width = 64; treadCanvas.height = 8;
const tc = treadCanvas.getContext('2d');
tc.fillStyle = '#262826'; tc.fillRect(0, 0, 64, 8);
tc.fillStyle = '#4a4d48';
for (let i = 0; i < 4; i++) tc.fillRect(i * 16, 0, 7, 8);
const treadTex = () => {
  const t = new THREE.CanvasTexture(treadCanvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 1);
  return t;
};

const tank = new THREE.Group();                  // position + cap ; avant = +z local, gauche = +x local
const tilt = new THREE.Group();                  // suit la pente du terrain
tank.add(tilt);
const lightMat = mat(0xfff3c4, { emissive: 0xfff0b0, emissiveIntensity: 0.6 });

// chaque style de tank a son propre corps (tangage), tourelle, canon et réglages
const newRig = (name, stats) => {
  const body = new THREE.Group();
  tilt.add(body);
  return { name, body, kind: 'tank', arc: Math.PI, circles: [0], radius: 2, zoom: 1, smoke: 0.18, kick: 1.4, pos: new THREE.Vector3(), yaw: Math.PI, treads: [], wheels: [], antennas: [], exhausts: [], ...stats };
};
// chenille texturée + roues à rayons (on voit la roue tourner)
function addTrack(rig, sx, { x, w, h, len, wheelX, n, r, rEnd, wheelMat, hubMat }) {
  const tex = treadTex();
  box(w, h, len, mat(0xffffff, { map: tex, roughness: 0.95 }), sx * x, h / 2, 0, rig.body);
  rig.treads.push({ sx, tex });
  for (let i = 0; i < n; i++) {
    const end = i === 0 || i === n - 1, rr = end ? rEnd : r;
    const pivot = new THREE.Group();
    pivot.position.set(sx * wheelX, end ? rr + 0.14 : rr + 0.07, -(len - 0.6) / 2 + i * (len - 0.6) / (n - 1));
    cyl(rr, rr, 0.16, end ? hubMat : wheelMat, 0, 0, 0, pivot, 16).rotation.z = Math.PI / 2;
    box(0.06, 0.1, rr * 1.6, hubMat, sx * 0.08, 0, 0, pivot);
    box(0.06, rr * 1.6, 0.1, hubMat, sx * 0.08, 0, 0, pivot);
    rig.body.add(pivot);
    rig.wheels.push({ sx, pivot, r: rr });
  }
}
const addAntenna = (rig, parent, x, y, z, h) => {
  const a = new THREE.Group();
  a.position.set(x, y, z);
  cyl(0.012, 0.03, h, dark, 0, h / 2, 0, a, 5);
  parent.add(a);
  rig.antennas.push(a);
};

function buildHeavy() {
  const green = mat(0x55703d), darkGreen = mat(0x405a2f), steel = mat(0x5b605a, { metalness: 0.4 }), tan = mat(0x6e5d3c);
  const rig = newRig('Tank', { speed: 12, turn: 2.2, turretRate: 3.5, reload: 0.6, trackX: 1.5, trackLen: 4.3, barrelZ: 1.2, recoilLen: 0.6, muzzle: new THREE.Vector3(0, 0, 3.3) });
  const b = rig.body;
  // caisse
  box(2.2, 0.6, 4.0, darkGreen, 0, 0.65, 0, b);
  box(3.7, 0.35, 3.6, green, 0, 1.12, -0.15, b);
  box(3.7, 0.35, 0.9, green, 0, 1.0, 1.85, b).rotation.x = 0.45;             // glacis avant
  box(3.7, 0.5, 0.15, darkGreen, 0, 0.95, -1.98, b);
  for (let i = 0; i < 5; i++) box(1.6, 0.05, 0.12, dark, 0, 1.31, -0.9 - i * 0.2, b);  // grille moteur
  for (const x of [-0.9, 0.9]) {
    cyl(0.1, 0.1, 0.4, dark, x, 1.0, -2.1, b).rotation.x = Math.PI / 2;
    rig.exhausts.push(new THREE.Vector3(x, 1.0, -2.35));
  }
  for (const x of [-1.35, 1.35]) box(0.25, 0.15, 0.12, lightMat, x, 1.25, 1.95, b);
  for (const x of [-1.55, 1.55]) box(0.45, 0.22, 1.2, tan, x, 1.4, -0.7, b);  // coffres sur les garde-boue
  for (const sx of [-1, 1]) addTrack(rig, sx, { x: 1.5, w: 0.85, h: 0.9, len: 4.3, wheelX: 1.94, n: 7, r: 0.29, rEnd: 0.36, wheelMat: dark, hubMat: steel });
  // tourelle
  const t = rig.turret = new THREE.Group();
  t.position.y = 1.3;
  b.add(t);
  box(2.0, 0.55, 2.2, green, 0, 0.28, -0.1, t);
  box(1.7, 0.14, 1.8, green, 0, 0.6, -0.15, t);
  box(1.8, 0.45, 0.6, darkGreen, 0, 0.3, -1.45, t);                          // panier arrière
  box(1.0, 0.5, 0.45, darkGreen, 0, 0.3, 1.1, t);                            // masque du canon
  cyl(0.32, 0.36, 0.3, darkGreen, 0.5, 0.8, -0.45, t);                       // tourelleau
  cyl(0.28, 0.28, 0.06, dark, 0.5, 0.98, -0.45, t);
  cyl(0.04, 0.04, 0.8, dark, 0.5, 1.05, -0.05, t).rotation.x = Math.PI / 2;  // mitrailleuse
  box(0.22, 0.14, 0.16, dark, -0.45, 0.72, 0.35, t);                         // périscope
  for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) cyl(0.07, 0.07, 0.25, dark, sx * 1.02, 0.42 + i * 0.12, 0.65, t, 8).rotation.x = Math.PI / 2;  // lance-fumigènes
  addAntenna(rig, t, -0.7, 0.66, -1.3, 2.2);
  // canon
  const br = rig.barrel = new THREE.Group();
  br.position.set(0, 0.3, 1.2);
  t.add(br);
  cyl(0.12, 0.15, 3.0, dark, 0, 0, 1.5, br).rotation.x = Math.PI / 2;
  cyl(0.2, 0.2, 0.45, dark, 0, 0, 1.6, br).rotation.x = Math.PI / 2;        // évacuateur de fumée
  box(0.36, 0.28, 0.4, steel, 0, 0, 3.05, br);                                // frein de bouche
  return rig;
}

function buildShip() {
  const hullMat = mat(0x6b7480), upper = mat(0x8d959e), deck = mat(0x4d545a), glass = mat(0x1e2a33, { roughness: 0.2, metalness: 0.3 });
  const orange = mat(0xe2722b), white = mat(0xe8ecef);
  const rig = newRig('Navire de guerre', { kind: 'ship', speed: 10, turn: 0.7, turretRate: 2.5, reload: 0.9, barrelZ: 0.75, recoilLen: 0.35, kick: 0.3,
    muzzle: new THREE.Vector3(0, 0, 2.45), arc: 2.4, circles: [-4.2, 0, 4.2], radius: 1.8, zoom: 1.3, smoke: 0.4, pos: findShipSpawn() });
  const b = rig.body;
  // coque : contour en pointe extrudé (y du dessin négatif = avant après rotation)
  const outline = new THREE.Shape();
  outline.moveTo(-1.45, 6); outline.lineTo(1.45, 6); outline.lineTo(1.65, -1);
  outline.quadraticCurveTo(1.5, -4.6, 0, -6.4); outline.quadraticCurveTo(-1.5, -4.6, -1.65, -1); outline.closePath();
  mesh(new THREE.ExtrudeGeometry(outline, { depth: 1.7, bevelEnabled: false }).rotateX(-Math.PI / 2).translate(0, -0.9, 0), hullMat, 0, 0, 0, b);
  mesh(new THREE.ShapeGeometry(outline).rotateX(-Math.PI / 2), deck, 0, 0.81, 0, b).scale.set(0.96, 1, 0.97);
  // superstructure
  box(2.3, 1.1, 3.4, upper, 0, 1.35, -0.6, b);
  box(2.5, 0.85, 1.5, upper, 0, 2.3, 0.4, b);                                // passerelle
  box(2.52, 0.22, 0.12, glass, 0, 2.45, 1.16, b);
  for (const sx of [-1, 1]) box(0.12, 0.22, 1.2, glass, sx * 1.26, 2.45, 0.4, b);

// tactile : joystick gauche = rouler, droit = viser (tire tant qu'il est poussé)
const sticks = { L: { id: null, x: 0, y: 0, ox: 0, oy: 0, el: stickL }, R: { id: null, x: 0, y: 0, ox: 0, oy: 0, el: stickR } };
const STICK_R = 50;
function onTouch(e) {
  if (e.target.closest && e.target.closest('button')) return;  // laisse passer le tap sur le bouton
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (e.type === 'touchstart') {
      const s = t.clientX < innerWidth / 2 ? sticks.L : sticks.R;
      if (s.id !== null) continue;
      Object.assign(s, { id: t.identifier, ox: t.clientX, oy: t.clientY, x: 0, y: 0 });
      Object.assign(s.el.style, { display: 'block', left: t.clientX + 'px', top: t.clientY + 'px' });
      document.getElementById('help').textContent = 'Gauche : rouler · Droite : viser et tirer';
    }
    for (const s of Object.values(sticks)) {
      if (s.id !== t.identifier) continue;
      if (e.type === 'touchmove') {
        let dx = t.clientX - s.ox, dy = t.clientY - s.oy;
        const l = Math.hypot(dx, dy);
        if (l > STICK_R) { dx *= STICK_R / l; dy *= STICK_R / l; }
        s.x = dx / STICK_R; s.y = dy / STICK_R;
        s.el.firstChild.style.transform = `translate(${dx}px,${dy}px)`;
      } else if (e.type !== 'touchstart') {
        Object.assign(s, { id: null, x: 0, y: 0 });
        s.el.style.display = 'none';
        s.el.firstChild.style.transform = '';
      }
    }
  }
}
for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) addEventListener(ev, onTouch, { passive: false });

const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const turnToward = (cur, want, max) => cur + Math.max(-max, Math.min(max, wrap(want - cur)));
const tmp = new THREE.Vector3();

// ---------- boucle ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.max(1e-4, Math.min(clock.getDelta(), 0.05));  // jamais 0 : on divise par dt plus bas
  const k = (...c) => c.some((x) => keys[x]) ? 1 : 0;

  // déplacement : W/haut avance, S/bas recule, A/gauche et D/droite tournent ; joystick = direction à l'écran
  const time = clock.elapsedTime, ship = rig.kind === 'ship';
  let throttle = k('KeyW', 'ArrowUp', 'w', 'z') - k('KeyS', 'ArrowDown', 's');
  let turn = k('KeyA', 'ArrowLeft', 'a', 'q') - k('KeyD', 'ArrowRight', 'd');
  const steer = rig.turn * (ship ? Math.min(1, 0.2 + Math.abs(speed) / rig.speed) : 1);  // un navire tourne mieux lancé
  const yaw0 = tank.rotation.y, speed0 = speed, old = tank.position.clone();
  const L = sticks.L, mag = Math.hypot(L.x, L.y);
  if (mag > 0.2) {
    const want = Math.atan2(L.x, L.y);           // écran droite = +x, écran bas = +z
    tank.rotation.y = turnToward(tank.rotation.y, want, steer * dt);
    throttle = mag * Math.max(0, Math.cos(wrap(want - tank.rotation.y)));
    turn = 0;
  }
  tank.rotation.y += turn * steer * dt;

  // pente sous le tank : avant/arrière et gauche/droite
  const yaw = tank.rotation.y, fx = Math.sin(yaw), fz = Math.cos(yaw), lx = Math.cos(yaw), lz = -Math.sin(yaw);
  const { x: px, z: pz } = tank.position;
  let grade = 0;
  if (!ship) {
    const hf = groundY(px + fx * 2, pz + fz * 2), hb = groundY(px - fx * 2, pz - fz * 2);
    const hl = groundY(px + lx * 1.5, pz + lz * 1.5), hr = groundY(px - lx * 1.5, pz - lz * 1.5);
    grade = (hf - hb) / 4;                       // > 0 : ça monte devant
    tilt.rotation.x += (-Math.atan2(hf - hb, 4) - tilt.rotation.x) * Math.min(1, dt * 8);
    tilt.rotation.z += (Math.atan2(hl - hr, 3) - tilt.rotation.z) * Math.min(1, dt * 8);
  }
  speed += (throttle * rig.speed * (1 - Math.max(-0.25, Math.min(0.6, grade * Math.sign(throttle)))) - speed) * Math.min(1, dt * (ship ? 0.7 : 3));
  tank.position.x += fx * speed * dt;
  tank.position.z += fz * speed * dt;

  // collisions avec les cibles (un cercle pour le tank, trois le long du navire) et bords
  for (const t of targets) {
    if (t.dead) continue;
    for (const o of rig.circles) {
      tmp.set(tank.position.x + fx * o, 0, tank.position.z + fz * o).sub(t.g.position).setY(0);
      const d = tmp.length(), min = t.r + rig.radius;
      if (d < min && d > 0.001) {
        tank.position.addScaledVector(tmp, (min - d) / d * 0.6);
        t.g.position.addScaledVector(tmp, -(min - d) / d * 0.4);  // on pousse la cible
      }
    }
  }
  tank.position.x = Math.max(-HALF, Math.min(HALF, tank.position.x));
  tank.position.z = Math.max(-HALF, Math.min(HALF, tank.position.z));
  // le tank ne va pas en eau profonde ; le navire ne touche jamais le fond (proue, milieu, poupe)
  const blocked = () => {
    const y = tank.rotation.y, { x, z } = tank.position;
    return ship ? [-6, 0, 6.2].some((o) => groundY(x + Math.sin(y) * o, z + Math.cos(y) * o) > WATER - 1) : groundY(x, z) < WATER - 0.6;
  };
  if (blocked()) {
    tank.position.copy(old);
    speed *= -0.3;
    if (blocked()) tank.rotation.y = yaw0;
  }
  const yawRate = wrap(tank.rotation.y - yaw0) / dt;
  if (ship) {                                    // flotte, tangue sur la houle et gîte dans les virages
    tank.position.y = WATER + Math.sin(time * 1.3) * 0.08;
    tilt.rotation.x = Math.sin(time * 1.1) * 0.015;
    tilt.rotation.z += (Math.max(-0.12, Math.min(0.12, yawRate * speed * 0.03)) + Math.sin(time * 0.8) * 0.02 - tilt.rotation.z) * Math.min(1, dt * 2);
    rig.radar.rotation.y += dt * 2;
  } else {
    tank.position.y = groundY(tank.position.x, tank.position.z);
    flattenTufts(tank.position.x, tank.position.z);
  }
  waterTex.offset.set(time * 0.01, time * 0.006);

  // chenilles et roues : chaque côté roule à sa vitesse quand le tank tourne
  for (const tr of rig.treads) tr.tex.offset.x += tr.sx * (speed - tr.sx * yawRate * 1.5) * dt / (rig.trackLen / 4);
  for (const w of rig.wheels) w.pivot.rotation.x += (speed - w.sx * yawRate * 1.5) * dt / w.r;
  for (const tr of rig.treads) {
    const p = tmp.set(px + lx * tr.sx * rig.trackX, 0, pz + lz * tr.sx * rig.trackX);
    if (!tr.last) tr.last = p.clone();
    else if (p.distanceTo(tr.last) > 0.5) { if (p.distanceTo(tr.last) < 3) addMark(tr.last, p); tr.last.copy(p); }
  }

  // la caisse plonge/se cabre (ressort), l'antenne oscille
  const accel = (speed - speed0) / dt;
  pitchV += (-pitch * 70 - pitchV * 9 - accel * 0.12) * dt;
  pitch += pitchV * dt;
  rig.body.rotation.x = pitch;
  swayV += (-sway * 40 - swayV * 3 - accel * 0.4) * dt;
  sway += swayV * dt;
  for (const a of rig.antennas) a.rotation.x = sway * 0.15;

  // fumée d'échappement et poussière quand il roule
  puffT -= dt;
  if (puffT <= 0 && Math.abs(speed) > 1) {
    puffT = 0.09;
    tank.updateWorldMatrix(true, true);
    for (const e of rig.exhausts) spawn({ pos: rig.body.localToWorld(e.clone()), vel: new THREE.Vector3(rnd(0.5), 1.2, rnd(0.5)), color: 0x6d6a66, color2: 0xcfcdc9, life: 0.9, size: rig.smoke, grow: 3, drag: 1, opacity: 0.5 });
    if (ship) {                                  // sillage : écume à la poupe et vague d'étrave
      const st = rig.body.localToWorld(tmp.set(0, 0, -6)).setY(WATER + 0.05);
      spawn({ geo: foamGeo, pos: st, vel: new THREE.Vector3(rnd(0.4), 0, rnd(0.4)), color: 0xffffff, life: 4, size: 0.9, grow: 3, drag: 0.6, opacity: 0.6 });
      for (const sx of [-1, 1]) {
        const bw = rig.body.localToWorld(tmp.set(sx * 1.1, 0, 4.8)).setY(WATER + 0.05);
        spawn({ geo: foamGeo, pos: bw, vel: new THREE.Vector3(lx * sx * 2.5, 0, lz * sx * 2.5), color: 0xffffff, life: 2.5, size: 0.4, grow: 3, drag: 0.8, opacity: 0.55 });
      }
    } else for (const sx of [-rig.trackX, rig.trackX]) spawn({ pos: rig.body.localToWorld(tmp.set(sx, 0.2, -Math.sign(speed) * 2.1)), vel: new THREE.Vector3(rnd(0.6), 0.5, rnd(0.6)), color: 0xa8895f, life: 0.8, size: 0.3, grow: 2.5, drag: 2, opacity: 0.35 });
  }

  // visée (rayon de la souris sur un plan à la hauteur du tank)
  let aiming = false;
  if (useMouse) {
    ground.constant = -tank.position.y;
    ray.setFromCamera(mouse, camera);
    if (ray.ray.intersectPlane(ground, tmp)) { turretYaw = turnToward(turretYaw, Math.atan2(tmp.x - tank.position.x, tmp.z - tank.position.z), rig.turretRate * dt); }
  }
  const R = sticks.R;
  if (Math.hypot(R.x, R.y) > 0.3) {
    turretYaw = turnToward(turretYaw, Math.atan2(R.x, R.y), rig.turretRate * dt);
    aiming = true;
  }
  rig.turret.rotation.y = Math.max(-rig.arc, Math.min(rig.arc, wrap(turretYaw - tank.rotation.y)));  // le canon du navire ne vise pas à travers la passerelle

  // tir : le canon recule d'un coup puis revient en douceur
  reload -= dt;
  if (keys.Space || mouseDown || aiming) fire();
  recoil = Math.max(0, recoil - dt * 2.2);
  rig.barrel.position.z = rig.barrelZ - rig.recoilLen * recoil * recoil;
  flashT -= dt;
  flash.visible = flashT > 0;
  if (flash.visible) {
    const f = flashT / 0.09;
    flash.scale.setScalar(0.6 + (1 - f) * 0.9 + Math.random() * 0.2);
    flash.rotation.z = Math.random() * 6;
    flashMat.opacity = flashMat2.opacity = f;
  }
  flashLight.intensity = Math.max(0, flashT) * 900;
  impactLight.intensity *= Math.pow(0.0005, dt);

  // obus traçants : ils suivent le relief à hauteur fixe pour pouvoir toucher les cibles sur les collines
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.m.position.addScaledVector(s.vel, dt);
    s.m.position.y += (surfaceY(s.m.position.x, s.m.position.z) + 1.3 - s.m.position.y) * Math.min(1, dt * 8);
    s.life -= dt;
    spawn({ pos: s.m.position, color: 0xffc35a, color2: 0xe2e0dc, life: 0.3, size: 0.13, grow: 1.5, opacity: 0.8 });
    let hit = null;
    for (const t of targets) {
      if (!t.dead && Math.hypot(s.m.position.x - t.g.position.x, s.m.position.z - t.g.position.z) < t.r + 0.2) { hit = t; break; }
    }
    const out = Math.abs(s.m.position.x) > SIZE / 2 || Math.abs(s.m.position.z) > SIZE / 2;
    if (hit || s.life <= 0 || out) {
      explode(s.m.position, false);
      scene.remove(s.m);
      shells.splice(i, 1);
      if (hit) {
        hit.hp--; hit.hit = 0.15;
        hit.vel.addScaledVector(s.vel, 0.12).setY(0);
        if (hit.hp <= 0) {
          hit.dead = 4; hit.g.visible = false;
          explode(hit.g.position.clone().setY(hit.g.position.y + 1), true, hit.mesh.material.color.getHex());
          shake = 0.8;
          document.getElementById('score').textContent = ++score;
        }
      }
    }
  }

  // cibles : glissade, clignotement, réapparition
  for (const t of targets) {
    if (t.dead) {
      t.dead -= dt;
      if (t.dead <= 0) { t.dead = 0; t.hp = t.maxHp; t.g.position.copy(t.home); t.vel.set(0, 0, 0); t.g.visible = true; }
      continue;
    }
    t.g.position.addScaledVector(t.vel, dt);
    t.g.position.y = t.float ? WATER - 0.5 + Math.sin(time * 2 + t.home.x) * 0.1 : groundY(t.g.position.x, t.g.position.z);
    t.vel.multiplyScalar(Math.pow(0.02, dt));
    t.hit = Math.max(0, t.hit - dt);
    t.mesh.material.emissive.setHex(t.hit > 0 ? 0xffffff : 0x000000);
    t.mesh.material.emissiveIntensity = 0.8;
  }

  // particules
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    const f = Math.min(1, p.t / p.life);
    p.vel.y -= p.grav * dt;
    if (p.drag) p.vel.multiplyScalar(Math.exp(-p.drag * dt));
    p.m.position.addScaledVector(p.vel, dt);
    if (p.grav) {
      const gy = groundY(p.m.position.x, p.m.position.z) + 0.05;
      if (p.m.position.y < gy) { p.m.position.y = gy; p.vel.multiplyScalar(0.5); p.vel.y *= -0.3; }
    }
    if (p.spin) { p.m.rotation.x += dt * 8; p.m.rotation.y += dt * 6; }
    p.m.scale.setScalar(p.size * (1 + p.grow * Math.sqrt(f)));
    if (p.c2) p.m.material.color.copy(p.c1).lerp(p.c2, Math.min(1, f * 1.6));
    p.m.material.opacity = p.opacity * (1 - f);
    if (p.t >= p.life) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
  }
  for (let i = scorches.length - 1; i >= 0; i--) {
    const s = scorches[i];
    s.t -= dt;
    s.m.material.opacity = Math.min(1, s.t / 3);
    if (s.t <= 0) { scene.remove(s.m); s.m.material.dispose(); scorches.splice(i, 1); }
  }

  // caméra (lissée pour ne pas sautiller sur les bosses) et ombre qui suivent le tank
  focus.lerp(tank.position, Math.min(1, dt * 6));
  shake = Math.max(0, shake - dt * 2);
  camera.position.copy(focus).addScaledVector(CAM_OFFSET, rig.zoom);
  camera.position.x += rnd(shake * 0.5);
  camera.position.z += rnd(shake * 0.5);
  camera.lookAt(focus);
  sun.position.copy(focus).add(tmp.set(35, 28, 8));  // soleil assez bas pour que les collines se lisent
  sun.target.position.copy(focus);

  renderer.render(scene, camera);
});
window.game = { tank, targets, shells, parts, marks, groundY, get score() { return score; }, get rig() { return rig.name; }, selectRig, WATER, get flattened() { return flattened; } };  // pour les tests
</script>
</body>
</html>
