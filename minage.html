<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mineur Planétaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#060818;overflow:hidden;touch-action:none;font:600 16px 'Saira Condensed',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:3px 12px;border-radius:999px;background:rgba(8,12,30,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);letter-spacing:.3px}
.pill i{width:11px;height:11px;border-radius:3px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 0 6px currentColor}
.pill b{font-weight:800}
.big{position:fixed;top:30%;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 3px 12px rgba(0,0,0,.6)}
.big h1{margin:0;font:800 clamp(40px,9vw,84px)/1 'Saira Condensed',sans-serif;letter-spacing:3px;background:linear-gradient(#fff6c8,#ffb23e);-webkit-background-clip:text;background-clip:text;color:transparent}
.big p{margin:6px 0 0;font-size:clamp(16px,3vw,22px);opacity:.9}
#title{animation:fade 1s 3.5s forwards}
@keyframes fade{to{opacity:0;transform:translateY(-20px)}}
#help{position:fixed;bottom:10px;left:0;right:0;text-align:center;opacity:.65;font-size:14px;pointer-events:none;text-shadow:0 1px 3px #000}
.btn{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:70px;height:70px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,14,32,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:26px;display:none;touch-action:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.btn:active{background:rgba(255,200,90,.35)}
@media (pointer:coarse){.btn{display:block}#help{display:none}}
#bl{left:16px}#br{left:98px}#bj{right:98px}#bd{right:16px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><span class="pill">Profondeur <b id="depth">0</b> m</span><span id="inv"></span></div>
<div class="big" id="title"><h1>MINEUR PLANÉTAIRE</h1><p>Fais le tour du monde… ou creuse jusqu'au noyau</p></div>
<div class="big" id="msg"></div>
<div id="help">← → ou Q D : marcher (pousser contre un mur le creuse) · ↑ Z Espace : sauter · ↓ S : creuser dessous · clic maintenu : miner un bloc proche</div>
<button class="btn" id="bl" aria-label="Gauche">◀</button>
<button class="btn" id="br" aria-label="Droite">▶</button>
<button class="btn" id="bj" aria-label="Sauter">▲</button>
<button class="btn" id="bd" aria-label="Creuser">⛏</button>
<script>
const T = 16, R = 48, TAU = Math.PI * 2;           // taille d'un bloc, nombre d'anneaux de la planète
const W = 10, H = 22, SPEED = 110, G = 900, JUMP = 290, REACH = 3.5 * T;
const SUN_A = -Math.PI / 2 - 0.4;                   // direction du soleil : le côté opposé de la planète est la nuit
const TYPES = [
  null,
  { n: 'Herbe', c: '#5cbf4a', h: 1, drop: 2 },
  { n: 'Terre', c: '#8b5a2b', h: 1 },
  { n: 'Pierre', c: '#6e6e7c', h: 2 },
  { n: 'Charbon', c: '#1a1a1e', h: 2.5, ore: 1 },
  { n: 'Fer', c: '#e8a87c', h: 3, ore: 1 },
  { n: 'Or', c: '#ffd23f', h: 4, ore: 1 },
  { n: 'Diamant', c: '#5ef2ff', h: 5, ore: 1 },
  { n: 'Noyau', c: '#ff5a1f', h: Infinity },
];
const rgb = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16));
const mix = (c, f) => { const t = f < 0 ? 0 : 255, k = Math.abs(f); return `rgb(${rgb(c).map(v => v + (t - v) * k | 0)})`; };
for (const t of TYPES.slice(1)) {
  t.sh = [-.12, -.05, .03, .1].map(f => mix(t.c, f));
  t.hi = mix(t.c, .28); t.wall = mix(t.c, -.62);
}
const hash = (i, j) => ((i * 73856093) ^ (j * 19349663)) >>> 0;

// Planète : anneaux concentriques, chaque anneau a ~2πr blocs pour qu'ils restent à peu près carrés.
const rings = [], bg = [];
const s1 = Math.random() * TAU, s2 = Math.random() * TAU;
for (let i = 0; i < R; i++) {
  const n = Math.max(4, Math.round(TAU * (i + 0.5)));
  const ring = new Uint8Array(n), back = new Uint8Array(n);
  for (let j = 0; j < n; j++) {
    const a = (j + 0.5) / n * TAU;
    const top = Math.min(R - 1, R - 6 + Math.round(3 + 1.6 * Math.sin(3 * a + s1) + 1.2 * Math.sin(8 * a + s2)));
    const d = top - i, p = Math.random();
    ring[j] = i < 4 ? 8 : d < 0 ? 0 : d === 0 ? 1 : d < 4 ? 2
      : d > 30 && p < .03 ? 7 : d > 20 && p < .07 ? 6 : d > 10 && p < .13 ? 5 : p < .19 ? 4 : d > 6 && p < .25 ? 0 : 3;
    back[j] = d < 0 ? 0 : d < 4 ? 2 : 3;               // mur de fond visible une fois le bloc creusé
  }
  rings.push(ring); bg.push(back);
}

const cellAt = (rad, ang) => {
  const i = Math.floor(rad / T);
  if (i < 0 || i >= R) return null;
  const n = rings[i].length;
  return [i, Math.floor(((ang % TAU + TAU) % TAU) / TAU * n) % n];
};
const solid = (rad, ang) => { if (rad < 0) return true; const c = cellAt(rad, ang); return !!c && rings[c[0]][c[1]] > 0; };
// Largeur angulaire des pieds, mesurée au dessus de l'anneau : la même pour tout l'anneau, sinon on rebondit au bord d'un bloc.
const footDa = rad => (W / 2 - 1) / ((Math.floor(rad / T) + 1) * T);
const cellMid = (i, j) => { const a = (j + .5) / rings[i].length * TAU, r = (i + .5) * T; return [Math.cos(a) * r, Math.sin(a) * r]; };
// Le corps du mineur tient entre r et r+H, sur une largeur W.
const free = (r, a) => [2, H / 2, H - 2].every(h => {
  const rr = r + h, da = (W / 2 - 1) / rr;
  return !solid(rr, a - da) && !solid(rr, a + da);
});

// Décor : arbres posés sur l'herbe, nuages en orbite.
const trees = [];
for (let k = 0; k < 45; k++) {
  const a = Math.random() * TAU;
  for (let i = R - 1; i > 4; i--) {
    const c = cellAt(i * T + 1, a);
    if (!rings[c[0]][c[1]]) continue;
    if (rings[c[0]][c[1]] === 1) trees.push({ c, a, r: (i + 1) * T, s: .75 + Math.random() * .6, pine: Math.random() < .35 });
    break;
  }
}
const clouds = Array.from({ length: 9 }, () => ({ a: Math.random() * TAU, r: R * T + 60 + Math.random() * 90, s: .7 + Math.random() * .8, v: (Math.random() < .5 ? 1 : -1) * (.004 + Math.random() * .006) }));
const stars = Array.from({ length: 500 }, () => {
  const a = Math.random() * TAU, d = R * T * (1.05 + Math.random() * 2.5);
  return [Math.cos(a) * d, Math.sin(a) * d, Math.random() * 1.4 + 0.4, Math.random() * TAU];
});

const P = { a: -Math.PI / 2, r: 0, vr: 0, face: 1, ground: false, walk: 0, moving: false };
for (let i = R - 1; i >= 0; i--) if (solid(i * T + 1, P.a)) { P.r = (i + 1) * T; break; }
console.assert(P.r > 4 * T && free(P.r, P.a), 'apparition hors du sol');
console.assert(solid(T, 0) && !solid(R * T + 5, 0), 'noyau plein, ciel vide');

const inv = {};
let mine = null, prog = 0, chip = 0, won = false, parts = [], pops = [];
const keys = {}, ptr = { id: null, x: 0, y: 0 };

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
let cw, ch, z;
function resize() {
  const dpr = devicePixelRatio || 1;
  cw = cv.width = dark.width = innerWidth * dpr; ch = cv.height = dark.height = innerHeight * dpr;
  z = Math.max(1.5, Math.min(innerWidth, innerHeight) / 300) * dpr;
}
addEventListener('resize', resize); resize();

const cam = () => { const r = P.r + H / 2; return [Math.cos(P.a) * r, Math.sin(P.a) * r]; };
const ORIGIN_Y = 0.55;
function applyCam() {
  const [cx, cy] = cam();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(cw / 2, ch * ORIGIN_Y); ctx.scale(z, z); ctx.rotate(-Math.PI / 2 - P.a); ctx.translate(-cx, -cy);
}
function screenToWorld(x, y) {
  const dpr = devicePixelRatio || 1, rot = Math.PI / 2 + P.a;
  const vx = (x * dpr - cw / 2) / z, vy = (y * dpr - ch * ORIGIN_Y) / z;
  const [cx, cy] = cam();
  return [cx + vx * Math.cos(rot) - vy * Math.sin(rot), cy + vx * Math.sin(rot) + vy * Math.cos(rot)];
}

function burst(i, j, t, n) {
  const [x, y] = cellMid(i, j), ty = TYPES[t];
  for (let k = 0; k < n; k++) {
    const a = Math.random() * TAU, v = 40 + Math.random() * 90;
    const c = ty.ore ? (Math.random() < .5 ? ty.c : TYPES[3].c) : t === 1 ? (Math.random() < .5 ? ty.c : TYPES[2].c) : ty.c;
    parts.push({ x, y, vx: Math.cos(a) * v + x / 20, vy: Math.sin(a) * v + y / 20, life: .4 + Math.random() * .4, c, s: 1 + Math.random() * 1.8 });
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}

function step(dt) {
  let want = null;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), a0 = P.a;
  if (dir) {
    P.face = dir;
    const na = P.a + dir * SPEED * dt / P.r;
    const stepTop = (Math.floor((P.r + 2) / T) + 1) * T;
    if (free(P.r, na)) P.a = na;
    else if (P.ground && stepTop - P.r <= T && free(stepTop, na)) { P.r = stepTop; P.a = na; } // monte une marche
    else if (P.ground) {
      for (const h of [2, H / 2, H - 2]) {                       // creuse le bloc le plus bas du mur
        const rr = P.r + h, ea = na + dir * (W / 2) / rr;
        if (solid(rr, ea)) { want = cellAt(rr, ea); break; }
      }
    }
  }
  P.moving = P.a !== a0;
  P.walk = P.moving && P.ground ? P.walk + dt * 14 : 0;
  if (keys.down && P.ground) {                                   // le bloc sous le centre, sinon celui qui porte un pied
    const fa = footDa(P.r - 1), ang = [P.a, P.a - fa, P.a + fa].find(x => solid(P.r - 1, x));
    if (ang !== undefined) want = cellAt(P.r - 1, ang);
  }
  if (ptr.id !== null) {
    const [wx, wy] = screenToWorld(ptr.x, ptr.y), [cx, cy] = cam();
    if (Math.hypot(wx - cx, wy - cy) <= REACH && solid(Math.hypot(wx, wy), Math.atan2(wy, wx)))
      want = cellAt(Math.hypot(wx, wy), Math.atan2(wy, wx));
  }

  const t = want && rings[want[0]][want[1]];
  if (t && TYPES[t].h < Infinity) {
    if (!mine || mine[0] !== want[0] || mine[1] !== want[1]) { mine = want; prog = 0; }
    prog += dt * 2.5 / TYPES[t].h;
    if ((chip += dt) > .07) { chip = 0; burst(want[0], want[1], t, 1); }
    if (prog >= 1) {
      const ty = TYPES[TYPES[t].drop || t];
      inv[ty.n] = (inv[ty.n] || 0) + 1;
      rings[want[0]][want[1]] = 0; mine = null;
      burst(want[0], want[1], t, 12);
      pops.push({ i: want[0], j: want[1], text: '+1 ' + ty.n, c: ty.c, t: 1.2 });
    }
  } else mine = null;

  if (keys.up && P.ground) P.vr = JUMP;
  P.vr = Math.max(-500, P.vr - G * dt);
  const nr = P.r + P.vr * dt, da = footDa(nr), dh = footDa(nr + H);
  P.ground = false;
  if (P.vr <= 0) {
    if (solid(nr, P.a - da) || solid(nr, P.a + da)) { P.r = (Math.floor(nr / T) + 1) * T; P.vr = 0; P.ground = true; }
    else P.r = nr;
  } else if (solid(nr + H, P.a - dh) || solid(nr + H, P.a + dh)) P.vr = 0;
  else P.r = nr;

  for (const p of parts) {
    const d = Math.hypot(p.x, p.y);
    p.vx -= p.x / d * 500 * dt; p.vy -= p.y / d * 500 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) p.t -= dt;
  pops = pops.filter(p => p.t > 0);

  if (!won && P.ground && P.r <= 4 * T + 0.5) { won = true; document.getElementById('msg').innerHTML = '<h1>LE NOYAU !</h1><p>Tu as atteint le cœur de la planète</p>'; }
}

function sector(r0, r1, a0, a1) {
  ctx.beginPath(); ctx.arc(0, 0, r1, a0, a1); ctx.arc(0, 0, r0, a1, a0, true); ctx.closePath();
}
// Dessine dans le repère local d'un point de la surface : -y = vers le ciel.
function local(a, r, fn) {
  ctx.save(); ctx.translate(Math.cos(a) * r, Math.sin(a) * r); ctx.rotate(a + Math.PI / 2); fn(); ctx.restore();
}
const circle = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };

function drawTree(t) {
  local(t.a, t.r, () => {
    ctx.scale(t.s, t.s);
    ctx.fillStyle = '#5a3820'; ctx.fillRect(-2, -16, 4, 16); ctx.fillStyle = '#6f4728'; ctx.fillRect(-2, -16, 1.5, 16);
    if (t.pine) {
      for (const [y, w] of [[-12, 11], [-20, 9], [-27, 6.5]]) {
        ctx.fillStyle = '#2b6b40'; ctx.beginPath(); ctx.moveTo(-w, y); ctx.lineTo(w, y); ctx.lineTo(0, y - 12); ctx.fill();
        ctx.fillStyle = '#3a8a52'; ctx.beginPath(); ctx.moveTo(-w, y); ctx.lineTo(0, y); ctx.lineTo(0, y - 12); ctx.fill();
      }
    } else {
      circle(-7, -19, 7, '#2f7f34'); circle(7, -19, 7, '#2f7f34'); circle(0, -25, 10, '#3f9b3a');
      circle(-3, -28, 5.5, '#5cbf4a'); circle(-8, -21, 3, '#5cbf4a');
    }
  });
}

function drawMiner() {
  local(P.a, P.r, () => {
    ctx.scale(P.face, 1);
    const sw = Math.sin(P.walk) * 0.55;
    for (const [x, s] of [[-2, 1], [2, -1]]) {
      ctx.save(); ctx.translate(x, -7); ctx.rotate(sw * s);
      ctx.fillStyle = '#2d3e8c'; ctx.fillRect(-1.6, 0, 3.2, 6); ctx.fillStyle = '#3a2516'; ctx.fillRect(-1.6, 5, 4, 2.2);
      ctx.restore();
    }
    ctx.fillStyle = '#3f6fd8'; ctx.beginPath(); ctx.roundRect(-4.6, -15.5, 9.2, 9.5, 2); ctx.fill();
    ctx.fillStyle = '#2d3e8c'; ctx.fillRect(-4.6, -10, 9.2, 4); ctx.fillStyle = '#6b4226'; ctx.fillRect(-4.6, -10.5, 9.2, 1.4);
    circle(0, -18.5, 4, '#f1c27d');
    ctx.fillStyle = '#222'; ctx.fillRect(1.6, -19.6, 1.2, 1.4);
    ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(0, -19.2, 4.7, Math.PI, TAU); ctx.fill(); ctx.fillRect(-5, -19.6, 10.6, 1.5);
    ctx.fillStyle = '#e0a800'; ctx.fillRect(-5, -18.6, 10.6, .6);
    circle(4.8, -21.2, 1.4, '#fff8c0');
    const swing = mine ? Math.sin(performance.now() / 55) * 0.9 - 0.2 : 0.7;
    ctx.save(); ctx.translate(3, -11.5); ctx.rotate(swing);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(9, 0); ctx.stroke();
    ctx.strokeStyle = '#c9d1d9'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(7, -4.5); ctx.quadraticCurveTo(11.5, 0, 7, 4.5); ctx.stroke();
    circle(0, 0, 1.6, '#f1c27d');
    ctx.restore();
  });
}

function draw(now) {
  const time = now / 1000;
  const rel = Math.atan2(Math.sin(SUN_A - P.a), Math.cos(SUN_A - P.a));
  const day = Math.min(1, Math.max(0, 0.5 + 0.9 * Math.cos(rel)));
  const depth = (R - 3) - P.r / T;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const space = ctx.createLinearGradient(0, 0, 0, ch);
  space.addColorStop(0, '#04050f'); space.addColorStop(1, '#131a3c');
  ctx.fillStyle = space; ctx.fillRect(0, 0, cw, ch);

  // Soleil en espace écran : sa hauteur dépend de l'endroit où l'on marche sur la planète.
  const sx = cw / 2 + Math.sin(rel) * cw * 0.55, sy = ch * ORIGIN_Y - Math.cos(rel) * ch * 0.45, sr = Math.min(cw, ch) * 0.045;
  const sunCol = day > .75 ? '255,246,200' : '255,170,90';
  const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 6);
  glow.addColorStop(0, `rgba(${sunCol},.55)`); glow.addColorStop(1, `rgba(${sunCol},0)`);
  ctx.fillStyle = glow; ctx.fillRect(0, 0, cw, ch);

  applyCam();
  for (const [x, y, s, ph] of stars) {
    ctx.globalAlpha = (1 - day * .9) * (.55 + .45 * Math.sin(time * 2 + ph));
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, s, s);
  }
  ctx.globalAlpha = 1;
  const k = Math.min(1, Math.max(0, (day - .3) / .5));
  const atmCol = [255 + (110 - 255) * k, 140 + (180 - 140) * k, 90 + (255 - 90) * k].map(v => v | 0).join(',');
  const atm = ctx.createRadialGradient(0, 0, R * T * 0.92, 0, 0, R * T * 1.4);
  atm.addColorStop(0, `rgba(${atmCol},${.15 + .8 * Math.min(1, day * 1.4)})`);
  atm.addColorStop(.35, `rgba(${atmCol},${.08 + .35 * day})`);
  atm.addColorStop(1, `rgba(${atmCol},0)`);
  ctx.fillStyle = atm; ctx.beginPath(); ctx.arc(0, 0, R * T * 1.4, 0, TAU); ctx.fill();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  circle(sx, sy, sr, `rgb(${sunCol})`);
  applyCam();

  const cloudA = .25 + .6 * day;
  for (const c of clouds) {
    local(c.a + time * c.v, c.r, () => {
      ctx.scale(c.s, c.s); ctx.globalAlpha = cloudA;
      for (const [x, y, r] of [[0, -4, 12], [-13, 1, 9], [13, 1, 9], [5, -10, 8], [-6, -9, 7]]) circle(x, y, r, '#fff');
      ctx.globalAlpha = 1;
    });
  }

  const view = Math.hypot(cw, ch) / 2 / z + T, pr = P.r + H / 2, gems = [];
  ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(0,0,0,.22)';
  for (let i = Math.max(4, Math.floor((pr - view) / T)); i < Math.min(R, Math.ceil((pr + view) / T)); i++) {
    const ring = rings[i], n = ring.length, r0 = i * T, r1 = r0 + T;
    const da = view / Math.max(r0, 1);
    let j0 = Math.floor((P.a - da) / TAU * n), j1 = Math.ceil((P.a + da) / TAU * n);
    if (da >= Math.PI || j1 - j0 >= n) { j0 = 0; j1 = n - 1; }
    for (let jj = j0; jj <= j1; jj++) {
      const j = ((jj % n) + n) % n, t = ring[j], a0 = j / n * TAU, a1 = (j + 1) / n * TAU, am = (a0 + a1) / 2, h = hash(i, j);
      if (!t) {
        if (bg[i][j]) { sector(r0, r1, a0, a1); ctx.fillStyle = TYPES[bg[i][j]].wall; ctx.fill(); }
        continue;
      }
      const ty = TYPES[t], base = ty.ore ? TYPES[3] : t === 1 ? TYPES[2] : ty;
      const open = !solid(r1 + 1, am);
      sector(r0, r1, a0, a1); ctx.fillStyle = base.sh[h & 3]; ctx.fill(); ctx.stroke();
      if (h % 5 === 0) {                                     // petits cailloux pour la texture
        const ra = a0 + (a1 - a0) * ((h >> 3) % 10) / 10, rr = r0 + 3 + (h >> 7) % 9;
        circle(Math.cos(ra) * rr, Math.sin(ra) * rr, 1.3, base.sh[0]);
      }
      if (t === 1) {
        sector(r1 - 5, r1, a0, a1); ctx.fillStyle = ty.sh[h & 3]; ctx.fill();
        sector(r1 - 1.6, r1, a0, a1); ctx.fillStyle = ty.hi; ctx.fill();
        if (open) {
          ctx.strokeStyle = ty.sh[0]; ctx.lineWidth = 1;
          for (let b = 0; b < 4; b++) {
            const ba = a0 + (a1 - a0) * (b + .5) / 4, bl = 2 + ((h >> b) & 3), lean = (((h >> (b + 4)) & 3) - 1.5) * .006;
            ctx.beginPath(); ctx.moveTo(Math.cos(ba) * r1, Math.sin(ba) * r1); ctx.lineTo(Math.cos(ba + lean) * (r1 + bl), Math.sin(ba + lean) * (r1 + bl)); ctx.stroke();
          }
          if (h % 6 === 0) { const fa = a0 + (a1 - a0) * .7; circle(Math.cos(fa) * (r1 + 3.5), Math.sin(fa) * (r1 + 3.5), 1.6, ['#ff6fa8', '#fff27a', '#ffffff', '#b98cff'][(h >> 5) & 3]); }
          ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(0,0,0,.22)';
        }
      } else if (open) { sector(r1 - 2, r1, a0, a1); ctx.fillStyle = base.hi; ctx.fill(); }
      if (ty.ore) {
        for (const [fa, fr, s] of [[.28, .32, 2.8], [.7, .62, 2.3], [.58, .22, 1.8], [.25, .75, 1.6]]) {
          const a = a0 + (a1 - a0) * fa, r = r0 + T * fr, x = Math.cos(a) * r, y = Math.sin(a) * r;
          circle(x, y, s, ty.sh[0]); circle(x - s * .2, y - s * .2, s * .7, ty.c); circle(x - s * .35, y - s * .35, s * .3, ty.hi);
        }
        if (t >= 5) gems.push([...cellMid(i, j), h]);
      }
      if (mine && mine[0] === i && mine[1] === j) {
        const [mx, my] = cellMid(i, j);
        ctx.strokeStyle = 'rgba(20,10,0,.75)'; ctx.lineWidth = 1;
        for (let c = 0; c < 1 + prog * 6; c++) {
          const ca = c * 2.4 + h, len = 3 + prog * 6, kx = Math.cos(ca + .5) * len * .5, ky = Math.sin(ca + .5) * len * .5;
          ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + kx, my + ky); ctx.lineTo(mx + Math.cos(ca) * len, my + Math.sin(ca) * len); ctx.stroke();
        }
        sector(r0, r1, a0, a1); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
        ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(0,0,0,.22)';
      }
    }
  }

  for (const t of trees) if (rings[t.c[0]][t.c[1]] === 1 && Math.abs(Math.atan2(Math.sin(t.a - P.a), Math.cos(t.a - P.a))) * t.r < view) drawTree(t);
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;
  drawMiner();
  for (const p of pops) {
    const a = (p.j + .5) / rings[p.i].length * TAU;
    local(a, (p.i + 1) * T + (1.2 - p.t) * 18, () => {
      ctx.globalAlpha = Math.min(1, p.t * 2); ctx.font = '800 8px "Saira Condensed",sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(p.text, 0, 0); ctx.fillStyle = p.c; ctx.fillText(p.text, 0, 0);
      ctx.globalAlpha = 1;
    });
  }

  // Obscurité (profondeur ou nuit) percée par la lampe du casque.
  const darkness = Math.max(Math.min(.93, depth / 12), (1 - day) * .6);
  const lx = cw / 2, ly = ch * ORIGIN_Y - 10 * z;
  if (darkness > 0.01) {
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, cw, ch);
    dctx.fillStyle = `rgba(3,4,12,${darkness})`; dctx.fillRect(0, 0, cw, ch);
    dctx.globalCompositeOperation = 'destination-out';
    let g = dctx.createRadialGradient(lx, ly, 10 * z, lx, ly, 70 * z);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.fillRect(0, 0, cw, ch);
    g = dctx.createRadialGradient(lx, ly, 0, lx, ly, 170 * z);
    g.addColorStop(0, 'rgba(0,0,0,.95)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.moveTo(lx, ly);
    dctx.arc(lx, ly, 170 * z, P.face > 0 ? -.45 : Math.PI - .45, P.face > 0 ? .45 : Math.PI + .45); dctx.closePath(); dctx.fill();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(dark, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 110 * z);
    g.addColorStop(0, `rgba(255,190,110,${.18 * darkness})`); g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Par-dessus l'obscurité : les gemmes scintillent et le noyau de lave éclaire.
  applyCam();
  ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, h] of gems) {
    const s = Math.max(0, Math.sin(time * 2.2 + h % 100)) ** 4;
    if (s < .05) continue;
    ctx.globalAlpha = s; ctx.strokeStyle = '#fff'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (P.r - 4 * T < view + 8 * T) {
    const pulse = 1 + .06 * Math.sin(time * 2);
    const lava = ctx.createRadialGradient(0, 0, 0, 0, 0, 4 * T * 2.5 * pulse);
    lava.addColorStop(0, 'rgba(255,140,50,.9)'); lava.addColorStop(.4, 'rgba(255,90,30,.45)'); lava.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = lava; ctx.beginPath(); ctx.arc(0, 0, 4 * T * 2.5 * pulse, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  if (P.r - 4 * T < view) {
    const core = ctx.createRadialGradient(0, 0, 0, 0, 0, 4 * T);
    core.addColorStop(0, '#fff6c0'); core.addColorStop(.45, '#ffb02e'); core.addColorStop(.85, '#ff5a1f'); core.addColorStop(1, '#c2300c');
    circle(0, 0, 4 * T, core);
    ctx.strokeStyle = 'rgba(255,230,150,.6)'; ctx.lineWidth = 1.5;
    for (let b = 0; b < 24; b++) {
      const ba = b / 24 * TAU + time * .2, w = 2 + Math.sin(time * 3 + b) * 1.5;
      ctx.beginPath(); ctx.arc(0, 0, 4 * T - 3 - (b % 3) * 5, ba, ba + .1 * w); ctx.stroke();
    }
  }
}

const depthEl = document.getElementById('depth'), invEl = document.getElementById('inv');
function drawHud() {
  const d = String(Math.max(0, Math.round((R - 3) - P.r / T)));
  if (depthEl.textContent !== d) depthEl.textContent = d;
  const s = TYPES.slice(1).filter(t => inv[t.n]).map(t => `<span class="pill" style="color:${t.c}"><i style="background:${t.c}"></i><span style="color:#fff">${t.n} <b>${inv[t.n]}</b></span></span>`).join('');
  if (invEl.innerHTML !== s) invEl.innerHTML = s;
}

const MAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'up', ArrowDown: 'down', KeyS: 'down' };
addEventListener('keydown', e => { if (MAP[e.code]) { keys[MAP[e.code]] = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (MAP[e.code]) keys[MAP[e.code]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cv.addEventListener('pointerdown', e => { Object.assign(ptr, { id: e.pointerId, x: e.clientX, y: e.clientY }); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (e.pointerId === ptr.id) { ptr.x = e.clientX; ptr.y = e.clientY; } });
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, e => { if (e.pointerId === ptr.id) ptr.id = null; });
for (const [id, k] of [['bl', 'left'], ['br', 'right'], ['bj', 'up'], ['bd', 'down']]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; b.setPointerCapture(e.pointerId); });
  for (const ev of ['pointerup', 'pointercancel']) b.addEventListener(ev, () => { keys[k] = false; });
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 120) { step(1 / 120); acc -= 1 / 120; }   // pas fixe : pas de traversée de blocs
  draw(now); drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
